<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-023-001 - Routage top-k</title>
  <desc id="desc">Schéma pédagogique du routage top-k : scores, softmax, sélection, masque, renormalisation et experts actifs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .block { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .input { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .router { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .active { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .inactive { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .mix { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .warn { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .label { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .math { font: 600 14px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .line { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="48" y="54">Routage top-k : sélectionner peu d'experts actifs</text>
  <text class="subtitle" x="48" y="82">Le routeur calcule des scores, masque les experts non retenus, puis renormalise les poids actifs.</text>

  <rect class="panel" x="60" y="120" width="1080" height="520" rx="14"/>

  <rect class="input" x="95" y="295" width="110" height="72" rx="12"/>
  <text class="math" x="140" y="326">x</text>
  <text class="small" x="122" y="350">entrée</text>

  <rect class="router" x="270" y="270" width="160" height="122" rx="14"/>
  <text class="label" x="321" y="302">Routeur</text>
  <text class="math" x="307" y="330">s = W_r x</text>
  <text class="small" x="302" y="356">un score par expert</text>

  <rect class="block" x="500" y="160" width="210" height="310" rx="12"/>
  <text class="label" x="542" y="192">Scores et softmax</text>
  <text class="math" x="530" y="230">E1 : 2.10 -> 0.52</text>
  <text class="math" x="530" y="275">E2 : 0.40 -> 0.10</text>
  <text class="math" x="530" y="320">E3 : 1.60 -> 0.32</text>
  <text class="math" x="530" y="365">E4 : -0.20 -> 0.06</text>
  <text class="small" x="530" y="425">Exemple pédagogique</text>
  <text class="small" x="530" y="448">les poids somment à 1</text>

  <rect class="warn" x="760" y="160" width="190" height="118" rx="12"/>
  <text class="label" x="810" y="192">Top-2</text>
  <text class="small" x="790" y="222">retenir E1 et E3</text>
  <text class="math" x="790" y="250">S(x)={1,3}</text>

  <rect class="mix" x="760" y="325" width="190" height="118" rx="12"/>
  <text class="label" x="795" y="357">Renormaliser</text>
  <text class="math" x="790" y="387">E1 : 0.62</text>
  <text class="math" x="790" y="415">E3 : 0.38</text>

  <rect class="active" x="1010" y="160" width="105" height="58" rx="10"/>
  <text class="small" x="1034" y="195">Expert 1</text>
  <rect class="inactive" x="1010" y="250" width="105" height="58" rx="10"/>
  <text class="small" x="1034" y="285">Expert 2</text>
  <rect class="active" x="1010" y="340" width="105" height="58" rx="10"/>
  <text class="small" x="1034" y="375">Expert 3</text>
  <rect class="inactive" x="1010" y="430" width="105" height="58" rx="10"/>
  <text class="small" x="1034" y="465">Expert 4</text>

  <rect class="block" x="310" y="530" width="720" height="48" rx="9"/>
  <text class="small" x="342" y="560">Lecture : les experts non retenus ne sont pas exécutés pour cette entrée. Le coût actif dépend de k.</text>

  <path class="line" d="M205 331 H270"/>
  <path class="line" d="M430 331 H500"/>
  <path class="line" d="M710 225 H760"/>
  <path class="line" d="M855 278 V325"/>
  <path class="line" d="M950 380 C980 350 995 370 1010 370"/>
  <path class="line" d="M950 380 C980 245 995 190 1010 190"/>
  <path class="dash" d="M950 210 C980 260 995 278 1010 278"/>
  <path class="dash" d="M950 410 C980 430 995 458 1010 458"/>

  <text class="small" x="434" y="690">FIG-023-001 - Routage top-k</text>
</svg>
