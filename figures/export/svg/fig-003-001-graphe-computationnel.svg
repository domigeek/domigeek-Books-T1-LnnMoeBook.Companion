<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">FIG-003-001 - Graphe computationnel simple</title>
  <desc id="desc">Graphe montrant une entrée, des paramètres, une prédiction, une perte et la propagation arrière des gradients.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#b45309"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .node { fill: #eef6ff; stroke: #2f5c8f; stroke-width: 2; }
      .param { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .loss { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
      .forward { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .backward { stroke: #b45309; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; marker-start: url(#arrowBack); }
      .label { font: 400 13px Arial, sans-serif; fill: #475569; }
      .grad { font: 700 13px Arial, sans-serif; fill: #92400e; }
    </style>
  </defs>
  <rect width="1280" height="620" fill="#ffffff"/>
  <text x="60" y="58" class="title">Graphe computationnel simple</text>
  <text x="60" y="86" class="subtitle">Forward : calculer la perte. Backward : propager les gradients vers les paramètres.</text>

  <rect x="80" y="170" width="150" height="78" rx="10" class="node"/>
  <text x="112" y="202" class="node-title">Entrée x</text>
  <text x="112" y="226" class="node-text">donnée</text>

  <rect x="80" y="315" width="150" height="78" rx="10" class="param"/>
  <text x="112" y="347" class="node-title">Poids w</text>
  <text x="112" y="371" class="node-text">paramètre</text>

  <rect x="80" y="445" width="150" height="78" rx="10" class="param"/>
  <text x="112" y="477" class="node-title">Biais b</text>
  <text x="112" y="501" class="node-text">paramètre</text>

  <rect x="360" y="300" width="190" height="92" rx="10" class="node"/>
  <text x="398" y="337" class="node-title">z = w*x + b</text>
  <text x="398" y="361" class="node-text">somme pondérée</text>

  <rect x="665" y="300" width="170" height="92" rx="10" class="node"/>
  <text x="695" y="337" class="node-title">Prédiction</text>
  <text x="695" y="361" class="node-text">ŷ</text>

  <rect x="665" y="450" width="170" height="78" rx="10" class="node"/>
  <text x="704" y="482" class="node-title">Cible y</text>
  <text x="704" y="506" class="node-text">référence</text>

  <rect x="970" y="330" width="190" height="100" rx="10" class="loss"/>
  <text x="1010" y="368" class="node-title">Perte L</text>
  <text x="1010" y="392" class="node-text">écart entre ŷ et y</text>

  <path d="M 230 209 C 285 210, 310 300, 354 330" class="forward"/>
  <path d="M 230 354 L 354 346" class="forward"/>
  <path d="M 230 484 C 285 482, 310 390, 354 365" class="forward"/>
  <path d="M 550 346 L 659 346" class="forward"/>
  <path d="M 835 346 C 895 350, 925 360, 964 374" class="forward"/>
  <path d="M 835 489 C 900 486, 930 428, 964 400" class="forward"/>

  <text x="280" y="286" class="label">forward</text>
  <text x="860" y="320" class="label">forward</text>

  <path d="M 970 445 C 910 505, 840 520, 760 400" class="backward"/>
  <text x="820" y="512" class="grad">∂L/∂ŷ</text>

  <path d="M 665 292 C 610 235, 540 235, 470 292" class="backward"/>
  <text x="545" y="238" class="grad">∂L/∂z</text>

  <path d="M 365 398 C 315 450, 260 390, 235 365" class="backward"/>
  <text x="270" y="430" class="grad">∂L/∂w</text>

  <path d="M 390 395 C 335 530, 270 520, 235 492" class="backward"/>
  <text x="300" y="536" class="grad">∂L/∂b</text>
</svg>
