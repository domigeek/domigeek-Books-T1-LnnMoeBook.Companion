<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">FIG-028-001 - Architecture globale Qaya</title>
  <desc id="desc">Schéma montrant que tous les flux multimodaux sont transformés en EventEnvelope, passent par ED, puis alimentent les fenêtres d'attention, les projections du monde, les experts et les actions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #162033; }
      .subtitle { font: 15px Arial, sans-serif; fill: #536273; }
      .band-title { font: 700 16px Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px Arial, sans-serif; fill: #162033; }
      .small { font: 14px Arial, sans-serif; fill: #162033; }
      .tiny { font: 12px Arial, sans-serif; fill: #536273; }
      .box { rx: 10; ry: 10; stroke-width: 2; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #7D8796; stroke-width: 1.6; marker-end: url(#arrow); }
      .band { fill: #FFFFFF; stroke: #D5DEE9; stroke-width: 2; rx: 12; ry: 12; }
    </style>
  </defs>

  <rect width="1240" height="760" fill="#FFFFFF"/>
  <text x="44" y="48" class="title">Architecture globale de Qaya</text>
  <text x="44" y="73" class="subtitle">Tous les flux deviennent des événements : vidéo, son, texte, métriques et mémoire passent d'abord par ED.</text>

  <rect x="34" y="104" width="282" height="530" class="band" fill="#F7FAFC"/>
  <text x="58" y="136" class="band-title">Entrées événementielles</text>

  <rect x="62" y="164" width="220" height="86" class="box" fill="#E8F3FF" stroke="#3B82F6"/>
  <text x="88" y="194" class="label">Sources multimodales</text>
  <text x="88" y="218" class="small">texte, vidéo, son,</text>
  <text x="88" y="238" class="small">capteurs, mémoire</text>

  <rect x="62" y="296" width="220" height="86" class="box" fill="#F1F5F9" stroke="#64748B"/>
  <text x="88" y="326" class="label">Messages / datagrams</text>
  <text x="88" y="350" class="small">paquets vidéo, chunks audio,</text>
  <text x="88" y="370" class="small">fragments et signaux</text>

  <rect x="62" y="428" width="220" height="118" class="box" fill="#F8FAFC" stroke="#64748B"/>
  <text x="88" y="459" class="label">EventEnvelope</text>
  <text x="88" y="483" class="small">eventId, source, type,</text>
  <text x="88" y="503" class="small">timestamp, payload,</text>
  <text x="88" y="523" class="small">correlationId</text>

  <rect x="356" y="104" width="250" height="530" class="band" fill="#FBFBFF" stroke="#D8D0FA"/>
  <text x="380" y="136" class="band-title">Porte d'entrée</text>

  <rect x="386" y="202" width="190" height="112" class="box" fill="#EAF2FF" stroke="#2563EB"/>
  <text x="438" y="232" class="label">ED</text>
  <text x="421" y="256" class="small">Event Driven LNN</text>
  <text x="417" y="276" class="small">porte d'entrée unique</text>
  <text x="423" y="296" class="small">rythme, rareté, charge</text>

  <rect x="380" y="412" width="202" height="110" class="box" fill="#F3EAFF" stroke="#7C3AED"/>
  <text x="414" y="442" class="label">Fenêtre d'attention</text>
  <text x="414" y="466" class="small">correlationId n → n+1</text>
  <text x="414" y="486" class="small">objet, épisode, budget</text>
  <text x="414" y="506" class="small">ttl et priorité</text>

  <rect x="646" y="104" width="322" height="530" class="band" fill="#F8FCF9" stroke="#CFEEDD"/>
  <text x="670" y="136" class="band-title">Interprétation et décision</text>

  <rect x="680" y="164" width="220" height="76" class="box" fill="#F3EAFF" stroke="#7C3AED"/>
  <text x="750" y="194" class="label">OAD</text>
  <text x="712" y="218" class="small">objets et concepts actifs</text>

  <rect x="680" y="282" width="220" height="86" class="box" fill="#FFF7E6" stroke="#D97706"/>
  <text x="738" y="314" class="label">LOTAD</text>
  <text x="708" y="338" class="small">tokens, liens, concepts,</text>
  <text x="738" y="358" class="small">intention</text>

  <rect x="680" y="410" width="220" height="96" class="box" fill="#E8F8F5" stroke="#0F766E"/>
  <text x="710" y="442" class="label">WoE / WoB / WoG</text>
  <text x="730" y="466" class="small">WoV / WoS</text>
  <text x="718" y="486" class="small">projections du payload</text>

  <rect x="680" y="548" width="220" height="68" class="box" fill="#EAFBEF" stroke="#16A34A"/>
  <text x="745" y="578" class="label">ECAD</text>
  <text x="718" y="602" class="small">causalité et décision</text>

  <rect x="1012" y="104" width="196" height="530" class="band" fill="#FFFDF8" stroke="#F1C38A"/>
  <text x="1034" y="136" class="band-title">Exploitation</text>

  <rect x="1032" y="190" width="150" height="76" class="box" fill="#F2F7FF" stroke="#2563EB"/>
  <text x="1072" y="220" class="label">Experts</text>
  <text x="1058" y="244" class="small">router, créer, geler</text>

  <rect x="1032" y="330" width="150" height="76" class="box" fill="#EAFBEF" stroke="#16A34A"/>
  <text x="1070" y="360" class="label">Actions</text>
  <text x="1060" y="384" class="small">réponse ou arrêt</text>

  <rect x="1032" y="498" width="150" height="82" class="box" fill="#F5F6FA" stroke="#64748B"/>
  <text x="1050" y="528" class="label">Observabilité</text>
  <text x="1052" y="552" class="small">eventId, correlationId,</text>
  <text x="1076" y="572" class="small">traces</text>

  <rect x="394" y="158" width="174" height="34" fill="#FEF3C7" stroke="#D97706" rx="17" ry="17"/>
  <text x="425" y="180" class="small">Chronos : ticks</text>

  <path class="arrow" d="M172 250 V296"/>
  <path class="arrow" d="M172 382 V428"/>
  <path class="arrow" d="M282 487 C326 487 350 258 386 258"/>
  <path class="arrow" d="M481 314 V412"/>
  <path class="arrow" d="M576 258 C620 258 638 202 680 202"/>
  <path class="arrow" d="M582 467 C626 467 636 202 680 202"/>
  <path class="arrow" d="M576 258 C628 258 632 322 680 322"/>
  <path class="arrow" d="M576 258 C628 258 632 458 680 458"/>
  <path class="arrow" d="M790 240 V282"/>
  <path class="arrow" d="M790 368 V410"/>
  <path class="arrow" d="M790 506 V548"/>
  <path class="arrow" d="M900 582 C940 582 975 228 1032 228"/>
  <path class="arrow" d="M900 582 C950 582 980 368 1032 368"/>
  <path class="soft" d="M568 175 C642 175 660 164 680 184"/>
  <path class="soft" d="M282 487 C520 650 853 642 1032 540"/>
  <path class="soft" d="M481 522 C614 658 856 646 1032 540"/>

  <text x="42" y="684" class="tiny">Lecture recommandée : aucun flux ne saute ED ; vision et son sont des payloads d'événements liés à une fenêtre par correlationId.</text>
  <text x="508" y="724" class="subtitle">FIG-028-001 - Architecture globale Qaya</text>
</svg>
