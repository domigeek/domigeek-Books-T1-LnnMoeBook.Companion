<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">FIG-033-001 - Agent comme orchestration bornée</title>
  <desc id="desc">Boucle agentique avec objectif, état de travail, modèle, outils, observations, budgets, permissions, traces et arrêt contrôlé.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 24px; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #475569; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .green { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 12; }
      .amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 12; }
      .red { fill: #fff1f2; stroke: #be123c; stroke-width: 2; rx: 12; }
      .trace { fill: #faf5ff; stroke: #9333ea; stroke-width: 2; rx: 12; }
      .decision { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .label { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; text-anchor: middle; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="620"/>
  <text class="title" x="56" y="48">Agent comme orchestration bornée</text>
  <text class="subtitle" x="56" y="72">Un agent utile n'est pas un modèle lâché sans contrôle : c'est une boucle avec état, outils, contraintes et traces.</text>

  <rect class="blue" x="64" y="246" width="150" height="72"/>
  <text class="label" x="139" y="276">Objectif</text>
  <text class="small" x="139" y="298">requête et contraintes</text>

  <rect class="box" x="268" y="236" width="170" height="92"/>
  <text class="label" x="353" y="270">État de travail</text>
  <text class="small" x="353" y="292">plan, hypothèses,</text>
  <text class="small" x="353" y="309">observations</text>

  <rect class="blue" x="492" y="246" width="150" height="72"/>
  <text class="label" x="567" y="276">Modèle</text>
  <text class="small" x="567" y="298">ou routeur</text>

  <path class="decision" d="M742 220 L842 282 L742 344 L642 282 Z"/>
  <text class="label" x="742" y="276">Prochaine</text>
  <text class="label" x="742" y="296">étape ?</text>

  <rect class="green" x="908" y="132" width="142" height="62"/>
  <text class="label" x="979" y="158">Répondre</text>
  <text class="small" x="979" y="178">sortie finale</text>

  <rect class="amber" x="908" y="238" width="142" height="62"/>
  <text class="label" x="979" y="264">Outil</text>
  <text class="small" x="979" y="284">API, recherche, test</text>

  <rect class="blue" x="908" y="344" width="142" height="62"/>
  <text class="label" x="979" y="370">Clarifier</text>
  <text class="small" x="979" y="390">entrée manquante</text>

  <rect class="red" x="908" y="450" width="142" height="62"/>
  <text class="label" x="979" y="476">Arrêt contrôlé</text>
  <text class="small" x="979" y="496">budget ou risque</text>

  <rect class="green" x="674" y="432" width="154" height="62"/>
  <text class="label" x="751" y="458">Observation</text>
  <text class="small" x="751" y="478">résultat ou erreur</text>

  <rect class="red" x="492" y="110" width="176" height="72"/>
  <text class="label" x="580" y="140">Budgets</text>
  <text class="small" x="580" y="162">temps, coût, droits</text>

  <rect class="trace" x="268" y="426" width="170" height="78"/>
  <text class="label" x="353" y="456">Trace</text>
  <text class="small" x="353" y="478">étapes, outils,</text>
  <text class="small" x="353" y="495">versions, erreurs</text>

  <path class="arrow" d="M214 282 H262"/>
  <path class="arrow" d="M438 282 H486"/>
  <path class="arrow" d="M642 282 H648"/>
  <path class="arrow" d="M842 282 C880 250 884 164 902 164"/>
  <path class="arrow" d="M842 282 H902"/>
  <path class="arrow" d="M842 282 C880 314 884 376 902 376"/>
  <path class="arrow" d="M842 282 C880 350 884 482 902 482"/>
  <path class="arrow-blue" d="M978 300 C978 424 842 460 834 462"/>
  <path class="arrow-blue" d="M674 463 C540 463 474 334 438 302"/>
  <path class="arrow" d="M908 376 C792 404 566 408 438 296"/>
  <path class="arrow" d="M580 182 C602 216 644 250 654 262"/>
  <path class="arrow dash" d="M353 328 V420"/>
  <path class="arrow dash" d="M908 164 C706 176 498 384 438 442"/>
  <path class="arrow dash" d="M908 482 C710 516 514 498 444 472"/>

  <text class="note" x="88" y="568">Lecture : l'agent ne vaut que par ses bornes. Les outils donnent de la puissance ; les budgets, permissions et traces rendent cette puissance exploitable.</text>
</svg>
