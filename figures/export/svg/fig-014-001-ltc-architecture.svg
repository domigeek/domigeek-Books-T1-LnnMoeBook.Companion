<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-014-001 - Architecture générale LTC</title>
  <desc id="desc">Schéma d'une architecture Liquid Time-Constant Network avec entrée, état continu, modulation, solveur et sortie.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .input { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .state { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .ltc { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .out { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .neutral { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .line { fill: none; stroke: #374151; stroke-width: 2.2; marker-end: url(#arrow); }
      .greenLine { fill: none; stroke: #047857; stroke-width: 2.7; marker-end: url(#greenArrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="54">Architecture générale d'un Liquid Time-Constant Network</text>
  <text class="subtitle" x="48" y="82">Un LTC combine état récurrent continu, modulation apprise et solveur numérique.</text>

  <rect class="panel" x="60" y="125" width="1080" height="505" rx="14"/>
  <text class="label" x="90" y="165">Flux principal</text>

  <rect class="input" x="100" y="280" width="145" height="78" rx="10"/>
  <text class="math" x="137" y="314">x(t)</text>
  <text class="small" x="125" y="337">entrée</text>

  <rect class="state" x="100" y="430" width="145" height="78" rx="10"/>
  <text class="math" x="137" y="464">h(t)</text>
  <text class="small" x="119" y="487">état continu</text>

  <rect class="ltc" x="340" y="260" width="260" height="150" rx="14"/>
  <text class="label" x="420" y="298">Cellule LTC</text>
  <text class="math" x="372" y="330">f_θ(h(t), x(t), t)</text>
  <text class="small" x="372" y="356">modulation de la dynamique</text>
  <text class="small" x="372" y="378">constante temporelle effective</text>

  <rect class="neutral" x="690" y="280" width="190" height="90" rx="10"/>
  <text class="label" x="742" y="315">Solveur</text>
  <text class="small" x="720" y="342">Euler, RK ou adaptatif</text>

  <rect class="state" x="960" y="280" width="145" height="78" rx="10"/>
  <text class="math" x="998" y="314">h(t+dt)</text>
  <text class="small" x="982" y="337">état intégré</text>

  <rect class="out" x="960" y="450" width="145" height="78" rx="10"/>
  <text class="math" x="1005" y="484">y(t)</text>
  <text class="small" x="989" y="507">sortie</text>

  <rect class="ltc" x="345" y="470" width="255" height="72" rx="10"/>
  <text class="math" x="378" y="500">τ_effectif(h,x,t)</text>
  <text class="small" x="382" y="522">vitesse de réaction variable</text>

  <path class="line" d="M245 319 H340"/>
  <path class="line" d="M245 469 C280 455 310 410 340 380"/>
  <path class="line" d="M600 335 H690"/>
  <path class="line" d="M880 325 H960"/>
  <path class="line" d="M1032 358 V450"/>
  <path class="greenLine" d="M472 410 V470"/>
  <path class="dash" d="M1032 280 C1040 190 780 180 620 200 C425 224 185 205 172 280"/>

  <rect class="neutral" x="292" y="565" width="615" height="44" rx="8"/>
  <text class="small" x="322" y="592">Lecture : la dynamique continue est intégrée numériquement ; la "liquidité" vient de la modulation de la constante temporelle effective.</text>

  <text class="small" x="405" y="660">FIG-014-001 - Architecture générale LTC</text>
</svg>
