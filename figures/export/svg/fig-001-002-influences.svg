<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc">
  <title id="title">FIG-001-002 - Des neurones logiques aux architectures modulaires</title>
  <desc id="desc">Graphe conceptuel reliant neurone biologique, neurone logique, apprentissage local, perceptron, deep learning, récurrence, temps continu, Mixture-of-Experts et architectures modulaires.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .edge { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .node { fill: #eef2ff; stroke: #475569; stroke-width: 1.7; }
      .modern { fill: #ecf8f0; stroke: #2f7d4f; stroke-width: 1.7; }
      .bridge { fill: #fff4e6; stroke: #b66a00; stroke-width: 1.7; }
    </style>
  </defs>
  <rect width="1280" height="880" fill="#ffffff"/>
  <text x="60" y="54" class="title">Des neurones logiques aux architectures modulaires</text>
  <text x="60" y="82" class="subtitle">Le fil du chapitre : calcul, apprentissage, profondeur, temps, routage et composition.</text>

  <rect x="70" y="170" width="190" height="80" rx="10" class="node"/>
  <text x="94" y="202" class="node-title">Neurone biologique</text>
  <text x="94" y="228" class="node-text">inspiration prudente</text>

  <rect x="330" y="110" width="210" height="80" rx="10" class="node"/>
  <text x="354" y="142" class="node-title">Neurone logique</text>
  <text x="354" y="168" class="node-text">McCulloch-Pitts</text>

  <rect x="330" y="250" width="210" height="80" rx="10" class="node"/>
  <text x="354" y="282" class="node-title">Apprentissage local</text>
  <text x="354" y="308" class="node-text">Hebb</text>

  <rect x="610" y="170" width="210" height="80" rx="10" class="node"/>
  <text x="634" y="202" class="node-title">Perceptron</text>
  <text x="634" y="228" class="node-text">classification linéaire</text>

  <rect x="890" y="170" width="210" height="80" rx="10" class="bridge"/>
  <text x="914" y="202" class="node-title">Deep learning</text>
  <text x="914" y="228" class="node-text">profondeur + backprop</text>

  <rect x="890" y="330" width="210" height="80" rx="10" class="bridge"/>
  <text x="914" y="362" class="node-title">RNN / LSTM / GRU</text>
  <text x="914" y="388" class="node-text">temps discret</text>

  <rect x="610" y="500" width="230" height="80" rx="10" class="modern"/>
  <text x="634" y="532" class="node-title">Temps continu</text>
  <text x="634" y="558" class="node-text">Neural ODE, CT-RNN, LTC</text>

  <rect x="890" y="500" width="210" height="80" rx="10" class="modern"/>
  <text x="914" y="532" class="node-title">Mixture-of-Experts</text>
  <text x="914" y="558" class="node-text">routage + spécialisation</text>

  <rect x="500" y="710" width="410" height="112" rx="10" class="modern"/>
  <text x="528" y="740" class="node-title">Architectures modulaires</text>
  <text x="528" y="765" class="node-text">mémoire + experts + contrôle</text>
  <text x="528" y="786" class="node-text">observabilité + gouvernance</text>

