<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="360" viewBox="0 0 1220 360" role="img" aria-labelledby="title desc">
  <title id="title">FIG-000-003 - Progression du lecteur</title>
  <desc id="desc">Figure p&#233;dagogique du Tome I.</desc>
  <style>
