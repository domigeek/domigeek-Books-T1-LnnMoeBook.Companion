<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-019-002 - Effondrement du routage</title>
  <desc id="desc">Histogramme pédagogique montrant un routeur MoE qui envoie trop de tokens vers un seul expert.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .axis { stroke: #334155; stroke-width: 2; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .barHot { fill: #fb923c; stroke: #ea580c; stroke-width: 2; }
      .barCold { fill: #93c5fd; stroke: #2563eb; stroke-width: 2; }
      .barIdle { fill: #cbd5e1; stroke: #64748b; stroke-width: 2; }
      .target { stroke: #047857; stroke-width: 2.5; stroke-dasharray: 7 7; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .ok { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .math { font: 600 13px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="48" y="54">Effondrement du routage : un expert absorbe le trafic</text>
  <text class="subtitle" x="48" y="82">La loss peut encore baisser pendant que la capacité réelle du MoE se concentre sur quelques experts.</text>

  <rect class="panel" x="60" y="125" width="1080" height="520" rx="14"/>

  <line class="axis" x1="135" y1="520" x2="820" y2="520"/>
  <line class="axis" x1="135" y1="520" x2="135" y2="185"/>
  <line class="grid" x1="135" y1="440" x2="820" y2="440"/>
  <line class="grid" x1="135" y1="360" x2="820" y2="360"/>
  <line class="grid" x1="135" y1="280" x2="820" y2="280"/>
  <line class="grid" x1="135" y1="200" x2="820" y2="200"/>

  <text class="small" x="95" y="525">0 %</text>
  <text class="small" x="87" y="445">20 %</text>
  <text class="small" x="87" y="365">40 %</text>
  <text class="small" x="87" y="285">60 %</text>
  <text class="small" x="87" y="205">80 %</text>

  <line class="target" x1="135" y1="470" x2="820" y2="470"/>
  <text class="small" x="635" y="462">cible uniforme approximative</text>

  <rect class="barHot" x="170" y="210" width="52" height="310" rx="6"/>
  <rect class="barCold" x="250" y="438" width="52" height="82" rx="6"/>
  <rect class="barIdle" x="330" y="494" width="52" height="26" rx="6"/>
  <rect class="barIdle" x="410" y="502" width="52" height="18" rx="6"/>
  <rect class="barIdle" x="490" y="510" width="52" height="10" rx="6"/>
  <rect class="barIdle" x="570" y="514" width="52" height="6" rx="6"/>
  <rect class="barIdle" x="650" y="506" width="52" height="14" rx="6"/>
  <rect class="barIdle" x="730" y="498" width="52" height="22" rx="6"/>

  <text class="small" x="178" y="546">E1</text>
  <text class="small" x="258" y="546">E2</text>
  <text class="small" x="338" y="546">E3</text>
  <text class="small" x="418" y="546">E4</text>
  <text class="small" x="498" y="546">E5</text>
  <text class="small" x="578" y="546">E6</text>
  <text class="small" x="658" y="546">E7</text>
  <text class="small" x="738" y="546">E8</text>

  <text class="math" x="178" y="198">78 %</text>
  <text class="math" x="258" y="426">21 %</text>

  <rect class="warn" x="875" y="185" width="235" height="132" rx="12"/>
  <text class="label" x="905" y="220">Symptômes</text>
  <text class="small" x="905" y="250">expert dominant</text>
  <text class="small" x="905" y="272">experts froids</text>
  <text class="small" x="905" y="294">gradients pauvres</text>

  <rect class="ok" x="875" y="360" width="235" height="155" rx="12"/>
  <text class="label" x="905" y="395">À mesurer</text>
  <text class="small" x="905" y="425">histogrammes par batch</text>
  <text class="small" x="905" y="447">entropie du routage</text>
  <text class="small" x="905" y="469">tokens rejetés</text>
  <text class="small" x="905" y="491">latence par expert</text>

  <rect class="warn" x="180" y="585" width="760" height="44" rx="8"/>
  <text class="small" x="210" y="613">Un MoE peut afficher beaucoup d'experts tout en n'utilisant réellement qu'une faible partie de sa capacité.</text>

  <text class="small" x="410" y="690">FIG-019-002 - Effondrement du routage</text>
</svg>
