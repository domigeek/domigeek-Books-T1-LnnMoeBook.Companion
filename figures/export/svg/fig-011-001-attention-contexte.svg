<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-011-001 - Attention et contexte</title>
  <desc id="desc">Schéma du mécanisme d'attention : tokens, projections query/key/value, matrice de scores, softmax et représentation contextualisée.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .token { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; filter: url(#shadow); }
      .proj { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; filter: url(#shadow); }
      .calc { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; filter: url(#shadow); }
      .out { fill: #ecfdf5; stroke: #059669; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #0f172a; }
      .line { fill: none; stroke: #334155; stroke-width: 2.1; marker-end: url(#arrow); }
      .softLine { fill: none; stroke: #94a3b8; stroke-width: 1.7; marker-end: url(#arrow); }
      .heat0 { fill: #e0f2fe; stroke: #bae6fd; }
      .heat1 { fill: #7dd3fc; stroke: #38bdf8; }
      .heat2 { fill: #0284c7; stroke: #0369a1; }
      .heatText { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .heatTextDark { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="54">Attention : chaque position reconstruit son contexte utile</text>
  <text class="subtitle" x="48" y="82">Les projections Q, K et V transforment une séquence en poids d'attention puis en représentation contextualisée.</text>

  <rect class="panel" x="42" y="120" width="235" height="410" rx="12"/>
  <text class="label" x="72" y="154">Séquence tokenisée</text>
  <text class="small" x="72" y="178">Exemple simplifié</text>

  <rect class="token" x="76" y="218" width="150" height="54" rx="9"/>
  <text class="label" x="118" y="251">Le</text>
  <rect class="token" x="76" y="292" width="150" height="54" rx="9"/>
  <text class="label" x="104" y="325">service</text>
  <rect class="token" x="76" y="366" width="150" height="54" rx="9"/>
  <text class="label" x="91" y="399">redémarre</text>
  <rect class="token" x="76" y="440" width="150" height="54" rx="9"/>
  <text class="label" x="93" y="473">connexion</text>

  <rect class="panel" x="325" y="120" width="245" height="410" rx="12"/>
  <text class="label" x="356" y="154">Projections apprises</text>
  <text class="small" x="356" y="178">Trois vues du même X</text>

  <rect class="proj" x="368" y="218" width="150" height="64" rx="9"/>
  <text class="label" x="419" y="246">Q</text>
  <text class="math" x="400" y="268">XW_Q</text>
  <rect class="proj" x="368" y="325" width="150" height="64" rx="9"/>
  <text class="label" x="420" y="353">K</text>
  <text class="math" x="400" y="375">XW_K</text>
  <rect class="proj" x="368" y="432" width="150" height="64" rx="9"/>
  <text class="label" x="420" y="460">V</text>
  <text class="math" x="400" y="482">XW_V</text>

  <path class="line" d="M226 245 C276 245 310 238 368 238"/>
  <path class="softLine" d="M226 319 C276 319 310 252 368 252"/>
  <path class="softLine" d="M226 393 C276 393 310 359 368 359"/>
  <path class="softLine" d="M226 467 C276 467 310 464 368 464"/>

  <rect class="calc" x="632" y="150" width="210" height="88" rx="12"/>
  <text class="label" x="685" y="185">Scores</text>
  <text class="math" x="664" y="211">QK^T / sqrt(d_k)</text>

  <rect class="panel" x="635" y="282" width="204" height="170" rx="12"/>
  <text class="label" x="681" y="316">Softmax</text>
  <text class="small" x="664" y="340">Matrice d'attention A</text>
  <rect class="heat0" x="666" y="365" width="34" height="26"/>
  <rect class="heat1" x="705" y="365" width="34" height="26"/>
  <rect class="heat0" x="744" y="365" width="34" height="26"/>
  <rect class="heat2" x="783" y="365" width="34" height="26"/>
  <rect class="heat0" x="666" y="396" width="34" height="26"/>
  <rect class="heat2" x="705" y="396" width="34" height="26"/>
  <rect class="heat1" x="744" y="396" width="34" height="26"/>
  <rect class="heat0" x="783" y="396" width="34" height="26"/>
  <text class="heatTextDark" x="714" y="414">fort</text>

  <rect class="out" x="915" y="202" width="210" height="94" rx="12"/>
  <text class="label" x="958" y="237">Contexte</text>
  <text class="math" x="988" y="262">A V</text>
  <text class="small" x="953" y="282">valeurs pondérées</text>

  <rect class="out" x="915" y="388" width="210" height="94" rx="12"/>
  <text class="label" x="958" y="423">Bloc suivant</text>
  <text class="small" x="951" y="450">MLP, résiduel,</text>
  <text class="small" x="961" y="469">normalisation</text>

  <path class="line" d="M518 250 C565 238 590 208 632 194"/>
  <path class="line" d="M518 357 C568 346 594 310 638 300"/>
  <path class="line" d="M842 194 C878 206 891 226 915 240"/>
  <path class="line" d="M840 366 C880 358 892 302 915 266"/>
  <path class="line" d="M518 464 C675 500 789 498 915 438"/>
  <path class="line" d="M1020 296 L1020 388"/>

  <rect class="panel" x="130" y="580" width="940" height="58" rx="10"/>
  <text class="small" x="158" y="615">À lire avec prudence : un poids d'attention montre une pondération interne, pas une preuve causale ni une mémoire persistante.</text>
  <text class="small" x="470" y="666">FIG-011-001 - Attention et contexte</text>
</svg>
