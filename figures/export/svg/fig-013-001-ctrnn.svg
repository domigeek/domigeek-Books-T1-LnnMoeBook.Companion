<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-013-001 - CT-RNN générale</title>
  <desc id="desc">Schéma d'une cellule CT-RNN avec entrée continue, état caché, fuite, récurrence, dérivée, solveur et sortie.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .input { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .state { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .dyn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .out { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .neutral { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .line { fill: none; stroke: #374151; stroke-width: 2.2; marker-end: url(#arrow); }
      .greenLine { fill: none; stroke: #047857; stroke-width: 2.7; marker-end: url(#greenArrow); }
      .orangeLine { fill: none; stroke: #ea580c; stroke-width: 2.5; marker-end: url(#orangeArrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="54">CT-RNN : une récurrence définie par une dynamique continue</text>
  <text class="subtitle" x="48" y="82">L'état caché h(t) évolue selon une dérivée, puis un solveur numérique calcule la trajectoire.</text>

  <rect class="panel" x="60" y="125" width="1080" height="505" rx="14"/>
  <text class="label" x="90" y="165">Architecture conceptuelle</text>

  <rect class="input" x="95" y="245" width="150" height="70" rx="10"/>
  <text class="math" x="133" y="278">x(t)</text>
  <text class="small" x="118" y="300">entrée continue</text>

  <rect class="state" x="95" y="420" width="150" height="70" rx="10"/>
  <text class="math" x="133" y="453">h(t)</text>
  <text class="small" x="119" y="475">état courant</text>

  <rect class="neutral" x="315" y="218" width="190" height="88" rx="10"/>
  <text class="math" x="355" y="252">W_x * x(t)</text>
  <text class="small" x="345" y="278">projection d'entrée</text>

  <rect class="neutral" x="315" y="392" width="190" height="88" rx="10"/>
  <text class="math" x="355" y="426">W_h * h(t)</text>
  <text class="small" x="344" y="452">récurrence interne</text>

  <rect class="dyn" x="555" y="235" width="250" height="120" rx="12"/>
  <text class="math" x="584" y="272">φ(W_h*h(t) + W_x*x(t) + b)</text>
  <text class="small" x="588" y="304">cible dynamique non linéaire</text>
  <text class="small" x="588" y="326">influencée par entrée et état</text>

  <rect class="dyn" x="555" y="420" width="250" height="70" rx="10"/>
  <text class="math" x="616" y="448">-h(t) / τ</text>
  <text class="small" x="610" y="470">fuite et constante temporelle</text>

  <rect class="state" x="865" y="300" width="205" height="90" rx="12"/>
  <text class="math" x="895" y="334">dh(t)/dt</text>
  <text class="small" x="895" y="358">dérivée de l'état</text>
  <text class="small" x="895" y="378">dynamique à intégrer</text>

  <rect class="out" x="865" y="470" width="205" height="70" rx="10"/>
  <text class="math" x="925" y="500">y(t)</text>
  <text class="small" x="905" y="522">sortie observée</text>

  <path class="line" d="M245 280 H315"/>
  <path class="line" d="M245 455 H315"/>
  <path class="line" d="M505 262 H555"/>
  <path class="line" d="M505 436 C530 415 540 380 555 340"/>
  <path class="orangeLine" d="M805 295 H865"/>
  <path class="orangeLine" d="M805 455 C825 420 845 380 865 355"/>
  <path class="greenLine" d="M967 390 C975 430 955 455 970 470"/>
  <path class="dash" d="M967 390 C1040 430 1040 570 705 570 C410 570 195 535 170 490"/>

  <rect class="neutral" x="362" y="530" width="415" height="52" rx="8"/>
  <text class="math" x="390" y="562">dh(t)/dt = (-h(t) + φ(W_h*h(t) + W_x*x(t) + b)) / τ</text>

  <text class="small" x="382" y="660">FIG-013-001 - CT-RNN générale</text>
</svg>
