<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-014-002 - Constantes temporelles adaptatives</title>
  <desc id="desc">Heatmap pédagogique montrant des constantes temporelles effectives variables selon le contexte et les neurones.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
