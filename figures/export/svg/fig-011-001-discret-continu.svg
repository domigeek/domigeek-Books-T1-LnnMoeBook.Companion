<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FIG-011-001 - Temps discret vs temps continu</title>
  <desc id="desc">Comparaison entre une trajectoire continue et une représentation discrète par pas fixes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .axis { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
      .grid { stroke: #dbe4f0; stroke-width: 1; }
      .curve { fill: none; stroke: #047857; stroke-width: 4; }
      .step { fill: none; stroke: #2563eb; stroke-width: 3.2; stroke-linejoin: round; }
      .sample { fill: #ffffff; stroke: #047857; stroke-width: 3; }
      .stepPoint { fill: #ffffff; stroke: #2563eb; stroke-width: 3; }
      .label { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .tagGreen { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
      .tagBlue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="48" y="54">Temps discret vs temps continu</text>
  <text class="subtitle" x="48" y="82">Le discret observe une dynamique par pas ; le continu modélise une trajectoire entre les observations.</text>

  <rect class="panel" x="60" y="125" width="1080" height="480" rx="14"/>

  <line class="grid" x1="135" y1="490" x2="1080" y2="490"/>
  <line class="grid" x1="135" y1="405" x2="1080" y2="405"/>
  <line class="grid" x1="135" y1="320" x2="1080" y2="320"/>
  <line class="grid" x1="135" y1="235" x2="1080" y2="235"/>
  <line class="axis" x1="135" y1="520" x2="1080" y2="520"/>
  <line class="axis" x1="135" y1="520" x2="135" y2="170"/>

  <text class="small" x="1070" y="548">temps</text>
  <text class="small" x="78" y="178">état</text>

  <line class="dash" x1="220" y1="170" x2="220" y2="520"/>
  <line class="dash" x1="340" y1="170" x2="340" y2="520"/>
  <line class="dash" x1="460" y1="170" x2="460" y2="520"/>
  <line class="dash" x1="580" y1="170" x2="580" y2="520"/>
  <line class="dash" x1="700" y1="170" x2="700" y2="520"/>
  <line class="dash" x1="820" y1="170" x2="820" y2="520"/>
  <line class="dash" x1="940" y1="170" x2="940" y2="520"/>

  <path class="curve" d="M150 455 C220 355 280 335 340 375 C405 420 455 355 500 275 C555 175 645 220 700 310 C760 410 825 455 900 365 C960 295 1015 270 1070 305"/>

  <path class="step" d="M150 455 H220 V360 H340 V378 H460 V330 H580 V220 H700 V310 H820 V430 H940 V355 H1070"/>

  <circle class="sample" cx="220" cy="360" r="7"/>
  <circle class="sample" cx="340" cy="378" r="7"/>
  <circle class="sample" cx="460" cy="330" r="7"/>
  <circle class="sample" cx="580" cy="220" r="7"/>
  <circle class="sample" cx="700" cy="310" r="7"/>
  <circle class="sample" cx="820" cy="430" r="7"/>
  <circle class="sample" cx="940" cy="355" r="7"/>

  <circle class="stepPoint" cx="220" cy="360" r="5"/>
  <circle class="stepPoint" cx="340" cy="378" r="5"/>
  <circle class="stepPoint" cx="460" cy="330" r="5"/>
  <circle class="stepPoint" cx="580" cy="220" r="5"/>
  <circle class="stepPoint" cx="700" cy="310" r="5"/>
  <circle class="stepPoint" cx="820" cy="430" r="5"/>
  <circle class="stepPoint" cx="940" cy="355" r="5"/>

  <rect class="tagGreen" x="185" y="150" width="260" height="42" rx="8"/>
  <text class="label" x="205" y="176">Trajectoire continue h(t)</text>

  <rect class="tagBlue" x="720" y="150" width="300" height="42" rx="8"/>
  <text class="label" x="740" y="176">Approximation par pas h_t</text>

  <rect class="warn" x="650" y="545" width="390" height="42" rx="8"/>
  <text class="small" x="672" y="572">Un pas fixe peut masquer ou inventer de la structure temporelle.</text>

  <text class="math" x="203" y="548">t_1</text>
  <text class="math" x="323" y="548">t_2</text>
  <text class="math" x="443" y="548">t_3</text>
  <text class="math" x="563" y="548">t_4</text>
  <text class="math" x="683" y="548">t_5</text>
  <text class="math" x="803" y="548">t_6</text>
  <text class="math" x="923" y="548">t_7</text>

  <text class="small" x="427" y="650">FIG-011-001 - Temps discret vs temps continu</text>
</svg>
