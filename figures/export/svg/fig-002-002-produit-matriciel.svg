<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">FIG-002-002 - Produit matriciel et dimensions</title>
  <desc id="desc">Schéma du produit matriciel A de shape m par n multiplié par B de shape n par p pour obtenir AB de shape m par p.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 15px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .matrix { fill: #eef6ff; stroke: #2f5c8f; stroke-width: 2; }
      .matrix-b { fill: #f4f1ff; stroke: #5b4bb2; stroke-width: 2; }
      .matrix-c { fill: #ecf8f0; stroke: #2f7d4f; stroke-width: 2; }
      .cell { fill: rgba(255,255,255,0.35); stroke: #64748b; stroke-width: 1; }
      .edge { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .match { stroke: #b45309; stroke-width: 4; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="560" fill="#ffffff"/>
  <text x="60" y="58" class="title">Produit matriciel et dimensions</text>
  <text x="60" y="86" class="subtitle">La dimension interne doit correspondre : (m, n) × (n, p) = (m, p).</text>

  <g transform="translate(105,150)">
    <text x="0" y="-25" class="label">A : (m × n)</text>
    <rect x="0" y="0" width="280" height="220" rx="8" class="matrix"/>
    <line x1="93" y1="0" x2="93" y2="220" class="cell"/>
    <line x1="186" y1="0" x2="186" y2="220" class="cell"/>
    <line x1="0" y1="73" x2="280" y2="73" class="cell"/>
    <line x1="0" y1="146" x2="280" y2="146" class="cell"/>
    <text x="35" y="45" class="text">a11</text>
    <text x="128" y="45" class="text">...</text>
    <text x="215" y="45" class="text">a1n</text>
    <text x="35" y="120" class="text">...</text>
    <text x="128" y="120" class="text">...</text>
    <text x="215" y="120" class="text">...</text>
    <text x="35" y="195" class="text">am1</text>
    <text x="128" y="195" class="text">...</text>
    <text x="215" y="195" class="text">amn</text>
    <path d="M 280 225 L 280 252" class="match"/>
    <text x="170" y="278" class="small">n colonnes</text>
  </g>

  <g transform="translate(520,150)">
    <text x="0" y="-25" class="label">B : (n × p)</text>
    <rect x="0" y="0" width="230" height="220" rx="8" class="matrix-b"/>
    <line x1="115" y1="0" x2="115" y2="220" class="cell"/>
    <line x1="0" y1="73" x2="230" y2="73" class="cell"/>
    <line x1="0" y1="146" x2="230" y2="146" class="cell"/>
    <text x="42" y="45" class="text">b11</text>
    <text x="154" y="45" class="text">b1p</text>
    <text x="42" y="120" class="text">...</text>
    <text x="154" y="120" class="text">...</text>
    <text x="42" y="195" class="text">bn1</text>
    <text x="154" y="195" class="text">bnp</text>
    <path d="M -30 0 L -58 0" class="match"/>
    <text x="-36" y="-16" class="small">n lignes</text>
  </g>

  <path d="M 415 260 L 500 260" class="edge"/>
  <text x="408" y="240" class="small">dimension interne n</text>

  <path d="M 770 260 L 855 260" class="edge"/>
  <text x="792" y="240" class="small">résultat</text>

  <g transform="translate(880,180)">
    <text x="0" y="-25" class="label">AB : (m × p)</text>
    <rect x="0" y="0" width="270" height="160" rx="8" class="matrix-c"/>
    <line x1="135" y1="0" x2="135" y2="160" class="cell"/>
    <line x1="0" y1="80" x2="270" y2="80" class="cell"/>
    <text x="42" y="50" class="text">c11</text>
    <text x="180" y="50" class="text">c1p</text>
    <text x="42" y="130" class="text">cm1</text>
    <text x="180" y="130" class="text">cmp</text>
  </g>

  <text x="270" y="485" class="subtitle">Chaque cellule de AB est un produit scalaire entre une ligne de A et une colonne de B.</text>
</svg>
