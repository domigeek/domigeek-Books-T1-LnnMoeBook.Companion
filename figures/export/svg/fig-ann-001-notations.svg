<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">FIG-ANN-001 - Notations math&#233;matiques</title>
  <desc id="desc">Figure p&#233;dagogique du Tome I.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; fill: #64748b; }
    .box-title { font-size: 15px; font-weight: 700; }
    .box-text { font-size: 12px; fill: #334155; }
    .small { font-size: 11px; fill: #475569; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>
  <text class="title" x="40" y="42">Notations math&#233;matiques principales</text>
  <text class="subtitle" x="40" y="64">Lire les symboles comme des composants de m&#233;canisme, pas comme d&#233;coration.</text>
  <rect x="60" y="110" width="250" height="58" rx="8" fill="#eef7f3" stroke="#2f7d5a"/>
  <text class="box-title" x="76" y="134">x</text>
  <text class="box-text" x="130" y="134">entr&#233;e ou observation</text>
  <rect x="360" y="110" width="250" height="58" rx="8" fill="#eef7f3" stroke="#2f7d5a"/>
  <text class="box-title" x="376" y="134">h(t)</text>
  <text class="box-text" x="430" y="134">&#233;tat latent dynamique</text>
  <rect x="660" y="110" width="250" height="58" rx="8" fill="#eef7f3" stroke="#2f7d5a"/>
  <text class="box-title" x="676" y="134">y</text>
  <text class="box-text" x="730" y="134">sortie du mod&#232;le</text>
  <rect x="60" y="192" width="250" height="58" rx="8" fill="#eef7f3" stroke="#2f7d5a"/>
  <text class="box-title" x="76" y="216">t, &#916;t</text>
  <text class="box-text" x="130" y="216">temps et intervalle</text>
  <rect x="360" y="192" width="250" height="58" rx="8" fill="#eef7f3" stroke="#2f7d5a"/>
  <text class="box-title" x="376" y="216">W, b</text>
  <text class="box-text" x="430" y="216">poids et biais</text>
  <rect x="660" y="192" width="250" height="58" rx="8" fill="#eef7f3" stroke="#2f7d5a"/>
  <text class="box-title" x="676" y="216">f&#952;</text>
  <text class="box-text" x="730" y="216">fonction apprise</text>
  <rect x="60" y="274" width="250" height="58" rx="8" fill="#eef7f3" stroke="#2f7d5a"/>
  <text class="box-title" x="76" y="298">&#964;</text>
  <text class="box-text" x="130" y="298">constante temporelle</text>
  <rect x="360" y="274" width="250" height="58" rx="8" fill="#eef7f3" stroke="#2f7d5a"/>
  <text class="box-title" x="376" y="298">&#8711;L</text>
  <text class="box-text" x="430" y="298">gradient de la perte</text>
  <rect x="660" y="274" width="250" height="58" rx="8" fill="#eef7f3" stroke="#2f7d5a"/>
  <text class="box-title" x="676" y="298">p(e|x)</text>
  <text class="box-text" x="730" y="298">probabilit&#233; de routage</text>
</svg>
