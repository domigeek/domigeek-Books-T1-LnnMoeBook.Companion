<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-025-001 - Orchestrateur LNN + MoE</title>
  <desc id="desc">Architecture hybride où un orchestrateur de type LNN maintient un état continu, pilote un routeur MoE, active des experts spécialisés, puis reçoit un retour d'observation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #fbfcff; }
      .input { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
      .encoder { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.6; }
      .lnn { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.8; }
      .router { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.8; }
      .expert { fill: #fff7ed; stroke: #f97316; stroke-width: 1.6; }
      .agg { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.7; }
      .output { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.6; }
      .obs { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #1e293b; }
      .text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .line-control { stroke: #8b5cf6; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .line-return { stroke: #16a34a; stroke-width: 1.7; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .line-obs { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720"/>
  <text class="title" x="42" y="48">Orchestrateur LNN + MoE</text>
  <text class="subtitle" x="42" y="72">Un état temporel continu pilote le routage vers des experts spécialisés ; les résultats reviennent dans la boucle de contrôle.</text>

  <rect class="input" x="48" y="185" width="160" height="100" rx="8"/>
  <text class="label" x="86" y="222">Entrée</text>
  <text class="text" x="82" y="250">x(t)</text>
  <text class="small" x="72" y="270">événement ou séquence</text>

  <rect class="encoder" x="270" y="185" width="185" height="100" rx="8"/>
  <text class="label" x="324" y="222">Encodeur</text>
  <text class="small" x="304" y="252">représentation exploitable</text>

  <rect class="lnn" x="530" y="165" width="220" height="140" rx="8"/>
  <text class="label" x="578" y="204">Orchestrateur LNN</text>
  <text class="text" x="592" y="232">état h(t)</text>
  <text class="small" x="575" y="258">dynamique temporelle</text>
  <text class="small" x="575" y="276">signal de contrôle</text>

  <rect class="router" x="830" y="175" width="210" height="120" rx="8"/>
  <text class="label" x="888" y="214">Routeur MoE</text>
  <text class="small" x="875" y="244">scores + contraintes</text>
  <text class="small" x="875" y="264">sélection top-k</text>

  <rect class="expert" x="820" y="390" width="240" height="120" rx="8"/>
  <text class="label" x="878" y="428">Experts spécialisés</text>
  <text class="small" x="870" y="458">modules activés conditionnellement</text>
  <text class="small" x="870" y="478">coût actif limité</text>

  <rect class="agg" x="535" y="405" width="210" height="100" rx="8"/>
  <text class="label" x="590" y="442">Agrégateur</text>
  <text class="small" x="580" y="472">fusion des sorties</text>

  <rect class="output" x="295" y="405" width="160" height="100" rx="8"/>
  <text class="label" x="344" y="442">Sortie</text>
  <text class="small" x="327" y="470">réponse ou action</text>

  <rect class="obs" x="72" y="475" width="220" height="105" rx="8"/>
  <text class="label" x="118" y="512">Observabilité</text>
  <text class="small" x="110" y="540">traces, coût, confiance</text>
  <text class="small" x="110" y="558">experts activés</text>

  <path class="line" d="M 208 235 L 270 235"/>
  <path class="line" d="M 455 235 L 530 235"/>
  <path class="line-control" d="M 750 235 L 830 235"/>
  <path class="line-control" d="M 935 295 C 940 330, 940 358, 940 390"/>
  <path class="line" d="M 820 450 L 745 455"/>
  <path class="line" d="M 535 455 L 455 455"/>
  <path class="line-return" d="M 640 405 C 610 365, 596 328, 610 305"/>
  <path class="line-obs" d="M 830 258 C 645 620, 355 610, 292 545"/>
  <path class="line-obs" d="M 820 482 C 560 635, 330 560, 292 540"/>

  <text class="small" x="292" y="650">À retenir : le LNN maintient l'état ; le MoE sélectionne les capacités ; l'observabilité rend le routage testable.</text>
  <text class="small" x="478" y="684">FIG-025-001 - Orchestrateur LNN + MoE</text>
</svg>
