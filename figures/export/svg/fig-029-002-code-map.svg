  <text x="855" y="401" class="label">Program.cs</text>
  <text x="855" y="425" class="small">rapports console,</text>
  <text x="855" y="445" class="small">smoke tests</text>

  <rect x="820" y="520" width="184" height="64" class="box" fill="#FFF1F2" stroke="#E11D48"/>
  <text x="851" y="548" class="label">Benchmarks</text>
