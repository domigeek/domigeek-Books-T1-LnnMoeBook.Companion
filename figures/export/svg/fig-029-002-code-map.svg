<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">FIG-029-002 - Carte des exemples implémentés</title>
  <desc id="desc">Carte reliant les exemples TorchSharp MLP, RNN, LTC, MoE, hybride, les tests xUnit, les rapports console et les benchmarks futurs.</desc>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #64748B; }
      .label { font: 700 15px Arial, sans-serif; fill: #172033; }
      .small { font: 400 12px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #64748B; }
      .box { stroke-width: 2; rx: 10; ry: 10; }
      .arrow { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow2); }
      .soft { stroke: #94A3B8; stroke-width: 1.6; fill: none; marker-end: url(#arrow2); }
      .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; rx: 14; ry: 14; }
    </style>
  </defs>

  <rect width="1240" height="760" fill="#FFFFFF"/>
  <text x="44" y="48" class="title">Carte des exemples implémentés</text>
  <text x="44" y="73" class="subtitle">Chaque exemple enseigne un mécanisme précis et possède des tests qui vérifient ses invariants locaux.</text>

  <rect x="54" y="115" width="210" height="496" class="band"/>
  <text x="82" y="151" class="label">Base commune</text>
  <rect x="84" y="208" width="150" height="102" class="box" fill="#E8F3FF" stroke="#2563EB"/>
  <text x="112" y="241" class="label">TorchSharp</text>
  <text x="108" y="265" class="small">tenseurs, shapes,</text>
  <text x="108" y="285" class="small">dtype, using var</text>

  <rect x="314" y="115" width="404" height="496" class="band"/>
  <text x="342" y="151" class="label">Exemples du chapitre</text>
  <rect x="350" y="184" width="174" height="82" class="box" fill="#EAF2FF" stroke="#2563EB"/>
  <text x="381" y="213" class="label">MlpClassifier</text>
  <text x="381" y="237" class="small">XOR, couche cachée</text>
  <text x="381" y="257" class="small">perte décroissante</text>

  <rect x="542" y="184" width="174" height="82" class="box" fill="#F3EAFF" stroke="#7C3AED"/>
  <text x="574" y="213" class="label">SimpleRnnForecast</text>
  <text x="574" y="237" class="small">sinusoïde, état</text>
  <text x="574" y="257" class="small">caché discret</text>

  <rect x="350" y="326" width="174" height="82" class="box" fill="#FFF7E6" stroke="#D97706"/>
  <text x="381" y="355" class="label">SimpleLtcCell</text>
  <text x="381" y="379" class="small">delta temps, solveur</text>
  <text x="381" y="399" class="small">tau effectif</text>

  <rect x="542" y="326" width="174" height="82" class="box" fill="#EAFBEF" stroke="#16A34A"/>
  <text x="574" y="355" class="label">SparseMoeLayer</text>
  <text x="574" y="379" class="small">top-k, experts actifs</text>
  <text x="574" y="399" class="small">load balancing</text>

  <rect x="446" y="468" width="174" height="82" class="box" fill="#ECFDF5" stroke="#059669"/>
  <text x="472" y="497" class="label">LiquidMoe</text>
  <text x="472" y="521" class="small">état temporel +</text>
  <text x="472" y="541" class="small">routage dynamique</text>

  <rect x="772" y="115" width="404" height="496" class="band"/>
  <text x="800" y="151" class="label">Validation et sortie</text>
  <rect x="820" y="205" width="184" height="96" class="box" fill="#F8FAFC" stroke="#475569"/>
  <text x="855" y="238" class="label">Tests xUnit</text>
  <text x="855" y="262" class="small">shapes, invariants,</text>
  <text x="855" y="282" class="small">cas invalides</text>

