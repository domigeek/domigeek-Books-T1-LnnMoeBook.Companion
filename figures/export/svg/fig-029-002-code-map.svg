  <text x="1064" y="301" class="small">test local</text>
  <text x="1064" y="323" class="small">preuve locale</text>
  <text x="1064" y="345" class="small">pas preuve</text>
  <text x="1064" y="367" class="small">scientifique</text>
  <text x="1064" y="410" class="small">bench avant</text>
  <text x="1064" y="432" class="small">production</text>

