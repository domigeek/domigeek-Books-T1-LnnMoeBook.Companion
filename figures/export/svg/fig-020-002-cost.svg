<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-020-002 - Paramètres totaux vs actifs</title>
  <desc id="desc">Comparaison pédagogique entre paramètres totaux, paramètres actifs par token et coûts cachés d'une couche Sparsely-Gated MoE.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .axis { stroke: #334155; stroke-width: 2; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .total { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2; }
      .active { fill: #bbf7d0; stroke: #047857; stroke-width: 2; }
      .hidden { fill: #fed7aa; stroke: #ea580c; stroke-width: 2; }
      .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .ok { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .math { font: 600 14px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="48" y="54">Paramètres totaux, paramètres actifs et coût réel</text>
  <text class="subtitle" x="48" y="82">Le sparse gating découple partiellement la capacité totale du calcul actif, mais il ne supprime pas les coûts système.</text>

  <rect class="panel" x="60" y="125" width="1080" height="520" rx="14"/>

  <line class="axis" x1="130" y1="520" x2="760" y2="520"/>
  <line class="axis" x1="130" y1="520" x2="130" y2="175"/>
  <line class="grid" x1="130" y1="440" x2="760" y2="440"/>
  <line class="grid" x1="130" y1="360" x2="760" y2="360"/>
  <line class="grid" x1="130" y1="280" x2="760" y2="280"/>
  <line class="grid" x1="130" y1="200" x2="760" y2="200"/>

  <text class="small" x="86" y="525">0</text>
  <text class="small" x="70" y="445">25 %</text>
  <text class="small" x="70" y="365">50 %</text>
  <text class="small" x="70" y="285">75 %</text>
  <text class="small" x="62" y="205">100 %</text>

  <rect class="total" x="185" y="200" width="95" height="320" rx="8"/>
  <rect class="active" x="355" y="460" width="95" height="60" rx="8"/>
  <rect class="hidden" x="525" y="390" width="95" height="130" rx="8"/>

  <text class="label" x="172" y="560">Paramètres</text>
  <text class="label" x="192" y="582">totaux</text>
  <text class="label" x="342" y="560">Paramètres</text>
  <text class="label" x="360" y="582">actifs</text>
  <text class="label" x="525" y="560">Coûts</text>
  <text class="label" x="518" y="582">cachés</text>

  <text class="math" x="175" y="188">N * P</text>
  <text class="math" x="350" y="448">k * P</text>
  <text class="small" x="505" y="355">dispatch, mémoire,</text>
  <text class="small" x="505" y="374">communication, latence</text>

  <rect class="ok" x="820" y="180" width="265" height="140" rx="12"/>
  <text class="label" x="850" y="215">Lecture utile</text>
  <text class="math" x="850" y="250">N = 64 experts</text>
  <text class="math" x="850" y="278">k = 2 actifs</text>
  <text class="small" x="850" y="304">la capacité totale grandit</text>

  <rect class="note" x="820" y="360" width="265" height="160" rx="12"/>
  <text class="label" x="850" y="395">Erreur fréquente</text>
  <text class="small" x="850" y="430">Dire "moins cher" sans mesurer</text>
  <text class="small" x="850" y="452">batch, dispatch, réseau,</text>
  <text class="small" x="850" y="474">mémoire et latence.</text>

  <rect class="note" x="225" y="600" width="720" height="38" rx="8"/>
  <text class="small" x="260" y="624">Le coût actif baisse seulement si l'infrastructure sait exploiter la sparsité sans créer un nouveau goulot.</text>

  <text class="small" x="398" y="690">FIG-020-002 - Paramètres totaux vs actifs</text>
</svg>
