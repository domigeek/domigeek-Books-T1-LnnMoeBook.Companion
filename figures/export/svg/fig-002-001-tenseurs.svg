<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="560" viewBox="0 0 1220 560" role="img" aria-labelledby="title desc">
  <title id="title">FIG-002-001 - Vecteur, matrice, tenseur</title>
  <desc id="desc">Schéma montrant le passage de scalaire à vecteur, matrice et tenseur, avec exemples de shapes utilisées en deep learning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .edge { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .soft-edge { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; }
      .node { fill: #eef6ff; stroke: #2f5c8f; stroke-width: 2; }
      .example { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1220" height="560" fill="#ffffff"/>
  <text x="60" y="58" class="title">Vecteur, matrice, tenseur</text>
  <text x="60" y="86" class="subtitle">Les objets de base du deep learning pratique : un scalaire, puis des axes qui portent du sens.</text>

  <rect x="80" y="175" width="190" height="105" rx="12" class="node"/>
  <text x="110" y="214" class="node-title">Scalaire</text>
  <text x="110" y="240" class="node-text">shape : ()</text>
  <text x="110" y="260" class="node-text">un seul nombre</text>

  <rect x="345" y="175" width="190" height="105" rx="12" class="node"/>
  <text x="375" y="214" class="node-title">Vecteur</text>
  <text x="375" y="240" class="node-text">shape : (features)</text>
  <text x="375" y="260" class="node-text">liste ordonnée</text>

  <rect x="610" y="175" width="210" height="105" rx="12" class="node"/>
  <text x="640" y="214" class="node-title">Matrice</text>
  <text x="640" y="240" class="node-text">shape : (lignes, colonnes)</text>
  <text x="640" y="260" class="node-text">table ou transformation</text>

  <rect x="895" y="175" width="250" height="105" rx="12" class="node"/>
  <text x="925" y="214" class="node-title">Tenseur</text>
  <text x="925" y="240" class="node-text">shape : (batch, temps, features)</text>
  <text x="925" y="260" class="node-text">tableau multidimensionnel</text>

  <path d="M 270 228 L 339 228" class="edge"/>
  <path d="M 535 228 L 604 228" class="edge"/>
  <path d="M 820 228 L 889 228" class="edge"/>

  <rect x="330" y="370" width="225" height="70" rx="10" class="example"/>
  <text x="356" y="400" class="node-title">Embedding</text>
  <text x="356" y="424" class="node-text">un token → un vecteur</text>

  <rect x="590" y="370" width="255" height="70" rx="10" class="example"/>
  <text x="616" y="400" class="node-title">Poids de couche</text>
  <text x="616" y="424" class="node-text">entrées → sorties</text>

  <rect x="900" y="370" width="245" height="70" rx="10" class="example"/>
  <text x="926" y="400" class="node-title">Batch de séquences</text>
  <text x="926" y="424" class="node-text">exemples × temps × features</text>

  <path d="M 440 280 L 442 368" class="soft-edge"/>
  <path d="M 715 280 L 717 368" class="soft-edge"/>
  <path d="M 1020 280 L 1022 368" class="soft-edge"/>
</svg>
