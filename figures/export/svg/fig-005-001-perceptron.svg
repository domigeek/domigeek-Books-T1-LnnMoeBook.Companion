<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">FIG-005-001 - Fonctionnement d'un perceptron</title>
  <desc id="desc">Schéma montrant les entrées, les poids, la somme pondérée, le biais, la fonction de seuil et la décision binaire d'un perceptron.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 31px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #334155; }
      .mono { font: 16px Consolas, monospace; fill: #111827; }
      .box { rx: 18; ry: 18; stroke-width: 2.5; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="60" y="58" class="title">Fonctionnement d'un perceptron</text>
  <text x="60" y="88" class="subtitle">Une décision binaire obtenue par somme pondérée, biais et fonction de seuil.</text>

  <rect x="70" y="145" width="190" height="270" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="105" y="188" class="label">Entrées</text>
  <text x="105" y="230" class="mono">x_1</text>
  <text x="105" y="275" class="mono">x_2</text>
  <text x="105" y="320" class="mono">...</text>
  <text x="105" y="365" class="mono">x_n</text>

  <rect x="335" y="145" width="205" height="270" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="375" y="188" class="label">Poids</text>
  <text x="375" y="230" class="mono">w_1</text>
  <text x="375" y="275" class="mono">w_2</text>
  <text x="375" y="320" class="mono">...</text>
  <text x="375" y="365" class="mono">w_n</text>

  <rect x="610" y="155" width="230" height="120" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="655" y="200" class="label">Somme pondérée</text>
  <text x="650" y="238" class="mono">z = w · x + b</text>

  <rect x="610" y="330" width="230" height="90" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="675" y="365" class="label">Biais</text>
  <text x="698" y="396" class="mono">b</text>

  <rect x="910" y="185" width="210" height="120" class="box" fill="#fefce8" stroke="#ca8a04"/>
  <text x="955" y="230" class="label">Seuil</text>
  <text x="945" y="268" class="mono">step(z)</text>

  <rect x="910" y="360" width="210" height="90" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="955" y="395" class="label">Décision</text>
  <text x="955" y="426" class="mono">0 ou 1</text>

  <path class="edge" d="M 260 235 C 295 215, 305 205, 335 205"/>
  <path class="edge" d="M 260 290 C 295 280, 305 275, 335 275"/>
  <path class="edge" d="M 260 345 C 295 360, 305 365, 335 365"/>

  <path class="edge" d="M 540 250 C 575 240, 590 225, 610 215"/>
  <path class="edge" d="M 725 330 L 725 280"/>
  <path class="edge" d="M 840 215 L 905 235"/>
  <path class="edge" d="M 1015 305 L 1015 355"/>

  <text x="76" y="485" class="subtitle">Lecture : les poids orientent la frontière, le biais la déplace, le seuil transforme le score en classe.</text>
</svg>
