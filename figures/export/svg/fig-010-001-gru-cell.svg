<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FIG-010-001 - Cellule GRU</title>
  <desc id="desc">Schéma interne d'une cellule GRU avec reset gate, update gate, candidat et mélange final de l'état caché.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 17px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .mathSmall { font: 500 14px "Consolas", "Cascadia Mono", monospace; fill: #374151; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .cell { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; filter: url(#shadow); }
      .state { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .gate { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .candidate { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .output { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .op { fill: #ffffff; stroke: #374151; stroke-width: 2; }
      .line { fill: none; stroke: #374151; stroke-width: 2.1; marker-end: url(#arrow); }
      .blueLine { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#blueArrow); }
      .orangeLine { fill: none; stroke: #ea580c; stroke-width: 2.3; marker-end: url(#orangeArrow); }
      .softLine { fill: none; stroke: #94a3b8; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="48" y="54">Cellule GRU : deux portes, un seul état caché</text>
  <text class="subtitle" x="48" y="82">Le GRU simplifie le LSTM : pas de cell state séparé, mais une mise à jour contrôlée de h_t.</text>

  <rect class="panel" x="46" y="126" width="190" height="310" rx="10"/>
  <text class="section" x="75" y="160">Entrées</text>

  <rect class="state" x="76" y="205" width="130" height="58" rx="8"/>
  <text class="math" x="122" y="240">x_t</text>
  <text class="small" x="83" y="285">observation courante</text>

  <rect class="output" x="76" y="330" width="130" height="58" rx="8"/>
  <text class="math" x="108" y="365">h_{t-1}</text>
  <text class="small" x="84" y="410">état caché précédent</text>

  <rect class="cell" x="280" y="126" width="820" height="440" rx="18"/>
  <text class="section" x="308" y="162">Intérieur de la cellule GRU</text>

  <rect class="panel" x="330" y="198" width="170" height="64" rx="8"/>
  <text class="mathSmall" x="362" y="224">[x_t, h_{t-1}]</text>
  <text class="small" x="357" y="246">entrée concaténée</text>

  <path class="line" d="M206 234 C255 234 280 222 330 222"/>
  <path class="line" d="M206 359 C250 359 282 246 330 246"/>

  <rect class="gate" x="345" y="330" width="160" height="68" rx="8"/>
  <text class="label" x="376" y="358">Reset gate</text>
  <text class="mathSmall" x="381" y="381">r_t = σ(...)</text>

  <rect class="gate" x="560" y="330" width="165" height="68" rx="8"/>
  <text class="label" x="592" y="358">Update gate</text>
  <text class="mathSmall" x="600" y="381">z_t = σ(...)</text>

  <rect class="candidate" x="435" y="455" width="190" height="68" rx="8"/>
  <text class="label" x="488" y="483">Candidat</text>
  <text class="mathSmall" x="481" y="506">g_t = tanh(...)</text>

  <path class="softLine" d="M415 262 C410 292 420 315 425 330"/>
  <path class="softLine" d="M430 262 C500 292 590 306 642 330"/>

  <circle class="op" cx="375" cy="455" r="24"/>
  <text class="math" x="368" y="461">×</text>
  <path class="blueLine" d="M425 398 C415 425 398 443 399 455"/>
  <path class="line" d="M206 359 C268 359 310 438 351 455"/>
  <path class="orangeLine" d="M399 455 H435"/>

  <circle class="op" cx="795" cy="324" r="25"/>
  <text class="math" x="788" y="330">×</text>
  <text class="mathSmall" x="756" y="284">(1 - z_t) * h_{t-1}</text>
  <path class="line" d="M206 359 C460 250 650 274 771 318"/>
  <path class="blueLine" d="M685 398 C735 392 775 365 795 349"/>

  <circle class="op" cx="795" cy="485" r="25"/>
  <text class="math" x="788" y="491">×</text>
  <text class="mathSmall" x="740" y="540">z_t * g_t</text>
  <path class="orangeLine" d="M625 489 H770"/>
  <path class="blueLine" d="M642 398 C700 440 742 470 771 480"/>

  <circle class="op" cx="925" cy="405" r="27"/>
  <text class="math" x="916" y="411">+</text>
  <path class="line" d="M820 324 C878 332 905 358 918 379"/>
  <path class="line" d="M820 485 C878 475 905 448 918 431"/>

  <rect class="output" x="1000" y="377" width="84" height="58" rx="8"/>
  <text class="math" x="1025" y="412">h_t</text>
  <path class="line" d="M952 405 H1000"/>

  <text class="math" x="640" y="198">h_t = (1 - z_t) * h_{t-1} + z_t * g_t</text>

  <rect class="panel" x="280" y="590" width="820" height="48" rx="8"/>
  <text class="small" x="306" y="620">Lecture : r_t influence le candidat ; z_t choisit le mélange entre ancien état et candidat.</text>
  <text class="small" x="455" y="656">FIG-010-001 - Cellule GRU</text>
</svg>
