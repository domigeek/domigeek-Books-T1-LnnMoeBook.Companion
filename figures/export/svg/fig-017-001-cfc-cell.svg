<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-017-001 - Cellule CfC</title>
  <desc id="desc">Schéma pédagogique d'une cellule CfC avec deux branches de contenu, une porte dépendante du temps et une sortie fermée.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .input { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .state { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .branch { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .gate { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .neutral { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .line { fill: none; stroke: #374151; stroke-width: 2.2; marker-end: url(#arrow); }
      .blueLine { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blueArrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="54">Cellule CfC : transition temporelle en forme fermée</text>
  <text class="subtitle" x="48" y="82">Schéma pédagogique : deux branches de contenu sont mélangées par une porte dépendante de Δt.</text>

  <rect class="panel" x="60" y="125" width="1080" height="505" rx="14"/>

  <rect class="input" x="95" y="220" width="150" height="70" rx="10"/>
  <text class="math" x="134" y="252">x_t</text>
  <text class="small" x="118" y="275">entrée</text>

  <rect class="state" x="95" y="390" width="150" height="70" rx="10"/>
  <text class="math" x="134" y="422">h_t</text>
  <text class="small" x="112" y="445">état courant</text>

  <rect class="input" x="95" y="500" width="150" height="58" rx="10"/>
  <text class="math" x="140" y="535">Δt</text>

  <rect class="branch" x="330" y="205" width="220" height="92" rx="12"/>
  <text class="label" x="385" y="236">Branche u</text>
  <text class="math" x="365" y="262">u = F_u(h_t, x_t)</text>

  <rect class="branch" x="330" y="372" width="220" height="92" rx="12"/>
  <text class="label" x="385" y="403">Branche v</text>
  <text class="math" x="365" y="429">v = F_v(h_t, x_t)</text>

  <rect class="gate" x="330" y="505" width="250" height="72" rx="12"/>
  <text class="label" x="388" y="532">Porte temporelle</text>
  <text class="math" x="358" y="556">g = sigmoid(F_g(...) * Δt + b)</text>

  <rect class="neutral" x="670" y="300" width="245" height="118" rx="12"/>
  <text class="label" x="725" y="332">Mélange fermé</text>
  <text class="math" x="700" y="364">h_{t+1} = (1-g)*u + g*v</text>
  <text class="small" x="700" y="390">pas de solveur ODE général</text>

  <rect class="state" x="990" y="325" width="120" height="70" rx="10"/>
  <text class="math" x="1014" y="358">h_{t+1}</text>
  <text class="small" x="1012" y="380">nouvel état</text>

  <path class="line" d="M245 255 H330"/>
  <path class="line" d="M245 425 H330"/>
  <path class="line" d="M245 255 C285 255 292 390 330 410"/>
  <path class="line" d="M245 425 C285 425 292 250 330 245"/>
  <path class="blueLine" d="M245 529 H330"/>
  <path class="line" d="M550 251 C615 255 640 310 670 335"/>
  <path class="line" d="M550 418 C615 415 640 380 670 365"/>
  <path class="blueLine" d="M580 541 C650 525 690 445 735 418"/>
  <path class="line" d="M915 359 H990"/>

  <rect class="neutral" x="285" y="595" width="630" height="42" rx="8"/>
  <text class="small" x="313" y="622">Lecture : CfC calcule une transition temporelle dépendante de Δt sans solveur ODE général.</text>

  <text class="small" x="465" y="665">FIG-017-001 - Cellule CfC</text>
</svg>
