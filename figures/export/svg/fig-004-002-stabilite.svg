<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">FIG-004-002 - Stabilité et points fixes</title>
  <desc id="desc">Schéma comparant une petite perturbation qui revient vers un point fixe stable et une perturbation qui s'éloigne d'un point fixe instable.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .label { font: 700 19px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #334155; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 14px Arial, sans-serif; fill: #475569; }
      .box { rx: 18; ry: 18; stroke-width: 2.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <text x="60" y="58" class="title">Stabilité, points fixes et perturbations</text>
  <text x="60" y="88" class="subtitle">Une même perturbation peut être amortie, attirer une trajectoire, ou s'amplifier selon la dynamique locale.</text>

  <rect x="70" y="195" width="210" height="120" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="100" y="242" class="label">Petite</text>
  <text x="100" y="269" class="label">perturbation</text>
  <text x="100" y="294" class="small">état légèrement déplacé</text>

  <rect x="420" y="95" width="250" height="125" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="455" y="142" class="label">Point fixe stable</text>
  <text x="455" y="171" class="small">la trajectoire revient</text>
  <circle cx="545" cy="195" r="10" fill="#ffffff" stroke="#166534" stroke-width="3"/>

  <rect x="420" y="335" width="250" height="125" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="455" y="382" class="label">Point fixe instable</text>
  <text x="455" y="411" class="small">la trajectoire s'éloigne</text>
  <circle cx="545" cy="435" r="10" fill="#ffffff" stroke="#991b1b" stroke-width="3"/>

  <rect x="830" y="95" width="260" height="125" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="875" y="142" class="label">Attracteur</text>
  <text x="875" y="171" class="small">région de convergence</text>
  <path d="M 930 195 C 950 170, 985 170, 1005 195 C 985 220, 950 220, 930 195" fill="none" stroke="#0369a1" stroke-width="3"/>

  <rect x="830" y="335" width="260" height="125" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="875" y="382" class="label">Divergence</text>
  <text x="875" y="411" class="small">sensibilité amplifiée</text>
  <path d="M 928 435 L 1008 375 M 928 435 L 1008 495" stroke="#9d174d" stroke-width="3" fill="none"/>

  <path class="edge" d="M 280 235 C 330 190, 360 165, 415 155"/>
  <text x="300" y="185" class="edge-label">dynamique dissipative</text>

  <path class="edge" d="M 670 157 C 725 150, 770 150, 825 155"/>
  <text x="712" y="134" class="edge-label">convergence</text>

  <path class="edge" d="M 280 280 C 330 335, 360 380, 415 396"/>
  <text x="305" y="365" class="edge-label">amplification</text>

  <path class="edge" d="M 670 397 C 725 397, 770 397, 825 397"/>
  <text x="720" y="378" class="edge-label">éloignement</text>

  <text x="70" y="510" class="subtitle">Lecture : la stabilité est une propriété locale à préciser. Elle dépend de la dynamique, de la région étudiée et de la taille des perturbations.</text>
</svg>
