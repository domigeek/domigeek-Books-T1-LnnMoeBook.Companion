<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-023-001 - Bloc MoE dans Mixtral</title>
  <desc id="desc">Schéma d'un bloc Transformer decoder-only où le feed-forward dense est remplacé par un routeur top-2 et huit experts SwiGLU, dont deux actifs par token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #fbfcff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .attention { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.6; }
      .router { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.7; }
      .expert-active { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.7; }
      .expert-idle { fill: #fff7ed; stroke: #f97316; stroke-width: 1.3; }
      .combine { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.7; }
      .output { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.6; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #1e293b; }
      .text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .tiny { font: 400 10px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .line-active { stroke: #16a34a; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .line-idle { stroke: #94a3b8; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .line-weight { stroke: #f59e0b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720"/>
  <text class="title" x="42" y="48">Bloc MoE dans Mixtral</text>
  <text class="subtitle" x="42" y="72">Dans chaque couche, le bloc feed-forward dense est remplacé par 8 experts ; le routeur en active 2 par token.</text>

  <rect class="panel" x="48" y="125" width="170" height="120" rx="8"/>
  <text class="label" x="78" y="158">Entrée token</text>
  <text class="text" x="78" y="188">représentation</text>
  <text class="text" x="78" y="210">courante x</text>

  <rect class="attention" x="285" y="115" width="190" height="140" rx="8"/>
  <text class="label" x="326" y="150">Attention</text>
  <text class="text" x="326" y="180">decoder-only</text>
  <text class="small" x="326" y="204">contexte + KV cache</text>
  <text class="small" x="326" y="224">reste dense</text>

  <rect class="router" x="560" y="105" width="210" height="160" rx="8"/>
  <text class="label" x="610" y="140">Routeur MoE</text>
  <text class="text" x="603" y="170">scores sur 8 experts</text>
  <text class="text" x="603" y="194">top-2 + softmax</text>
  <line x1="603" y1="215" x2="732" y2="215" stroke="#8b5cf6" stroke-width="1.2"/>
  <text class="small" x="603" y="238">deux poids non nuls</text>

  <rect class="expert-active" x="880" y="92" width="150" height="72" rx="8"/>
  <text class="label" x="918" y="124">Expert 1</text>
  <text class="small" x="918" y="146">SwiGLU actif</text>

  <rect class="expert-active" x="880" y="188" width="150" height="72" rx="8"/>
  <text class="label" x="918" y="220">Expert 4</text>
  <text class="small" x="918" y="242">SwiGLU actif</text>

  <rect class="expert-idle" x="880" y="300" width="150" height="52" rx="8"/>
  <text class="text" x="918" y="330">Expert 2</text>

  <rect class="expert-idle" x="880" y="370" width="150" height="52" rx="8"/>
  <text class="text" x="918" y="400">Expert 3</text>

  <rect class="expert-idle" x="880" y="440" width="150" height="52" rx="8"/>
  <text class="text" x="918" y="470">Experts 5-8</text>

  <rect class="combine" x="560" y="470" width="250" height="115" rx="8"/>
  <text class="label" x="610" y="506">Combinaison</text>
  <text class="text" x="610" y="534">w₁ E₁(x) + w₄ E₄(x)</text>
  <text class="small" x="610" y="558">sortie pondérée des 2 experts</text>

  <rect class="output" x="920" y="500" width="150" height="90" rx="8"/>
  <text class="label" x="956" y="535">Sortie</text>
  <text class="small" x="956" y="560">vers la couche</text>
  <text class="small" x="956" y="576">suivante</text>

  <path class="line" d="M 218 185 L 285 185"/>
  <path class="line" d="M 475 185 L 560 185"/>
  <path class="line-active" d="M 770 168 C 815 132, 838 124, 880 128"/>
  <path class="line-active" d="M 770 198 C 815 214, 840 222, 880 224"/>
  <path class="line-idle" d="M 770 218 C 820 280, 840 320, 880 326"/>
  <path class="line-idle" d="M 770 226 C 820 350, 840 390, 880 396"/>
  <path class="line-idle" d="M 770 234 C 820 424, 838 464, 880 466"/>
  <path class="line-weight" d="M 955 164 C 930 345, 845 472, 810 512"/>
  <path class="line-weight" d="M 955 260 C 920 385, 850 486, 810 528"/>
  <path class="line" d="M 810 528 L 920 545"/>

  <rect class="panel" x="80" y="455" width="320" height="115" rx="8"/>
  <text class="label" x="108" y="492">Lecture correcte</text>
  <text class="small" x="108" y="520">Mixtral n'est pas huit modèles séparés.</text>
  <text class="small" x="108" y="540">C'est un Transformer dont les FFN sont</text>
  <text class="small" x="108" y="560">remplacés par des experts routés.</text>

  <text class="small" x="262" y="650">À retenir : 8 experts disponibles dans la couche, 2 experts actifs par token, puis combinaison pondérée.</text>
  <text class="small" x="476" y="684">FIG-023-001 - Bloc MoE dans Mixtral</text>
</svg>
