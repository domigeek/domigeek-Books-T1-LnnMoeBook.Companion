<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-026-002 - Pipeline RAG</title>
  <desc id="desc">Pipeline Retrieval-Augmented Generation avec ingestion documentaire, index, retrieval, reranking, assemblage du contexte, génération et réponse sourcée.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #fbfcff; }
      .panel-ingest { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .panel-run { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .node-query { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .node-index { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .node-rag { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; }
      .node-gen { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #1e293b; }
      .text { font: 400 12px Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720"/>
  <text class="title" x="42" y="48">Pipeline RAG</text>
  <text class="subtitle" x="42" y="72">RAG récupère du contexte externe ; il ne remplace ni l'évaluation ni la vérification des sources.</text>

  <rect class="panel-ingest" x="60" y="120" width="1060" height="165" rx="10"/>
  <text class="label" x="90" y="158">Ingestion documentaire</text>
  <text class="small" x="90" y="180">Préparer les sources avant les requêtes : découpage, embeddings, métadonnées, index.</text>

  <rect class="node" x="130" y="215" width="160" height="48" rx="7"/>
  <text class="text" x="160" y="244">Documents sources</text>
  <rect class="node" x="360" y="215" width="130" height="48" rx="7"/>
  <text class="text" x="388" y="244">Découpage</text>
  <rect class="node" x="560" y="215" width="190" height="48" rx="7"/>
  <text class="text" x="588" y="237">Embeddings</text>
  <text class="small" x="588" y="255">+ métadonnées</text>
  <rect class="node-index" x="820" y="204" width="180" height="70" rx="8"/>
  <text class="text" x="860" y="235">Index externe</text>
  <text class="small" x="850" y="256">documents + vecteurs</text>
  <path class="line" d="M 290 239 L 360 239"/>
  <path class="line" d="M 490 239 L 560 239"/>
  <path class="line" d="M 750 239 L 820 239"/>

  <rect class="panel-run" x="60" y="350" width="1060" height="285" rx="10"/>
  <text class="label" x="90" y="388">Inférence avec retrieval</text>
  <text class="small" x="90" y="410">Chaque bloc peut être mesuré : qualité du retrieval, ranking, citations, latence et coût.</text>

  <rect class="node-query" x="95" y="470" width="105" height="54" rx="7"/>
  <text class="text" x="125" y="502">Requête</text>
  <rect class="node" x="245" y="470" width="145" height="54" rx="7"/>
  <text class="text" x="276" y="494">Transformation</text>
  <text class="small" x="280" y="512">de requête</text>
  <rect class="node-rag" x="435" y="470" width="120" height="54" rx="7"/>
  <text class="text" x="465" y="502">Retriever</text>
  <rect class="node" x="600" y="470" width="145" height="54" rx="7"/>
  <text class="text" x="628" y="494">Passages</text>
  <text class="small" x="626" y="512">candidats</text>
  <rect class="node" x="790" y="470" width="145" height="54" rx="7"/>
  <text class="text" x="820" y="494">Filtres</text>
  <text class="small" x="812" y="512">+ reranker</text>
  <rect class="node-rag" x="975" y="455" width="145" height="84" rx="7"/>
  <text class="text" x="1008" y="490">Contexte</text>
  <text class="small" x="1001" y="510">assemblé</text>

  <rect class="node" x="620" y="585" width="125" height="54" rx="7"/>
  <text class="text" x="650" y="617">Évaluation</text>
  <rect class="node-query" x="790" y="585" width="150" height="54" rx="7"/>
  <text class="text" x="824" y="607">Réponse</text>
  <text class="small" x="824" y="626">+ sources</text>
  <rect class="node-gen" x="975" y="585" width="145" height="54" rx="7"/>
  <text class="text" x="1003" y="617">Générateur</text>

  <path class="line" d="M 200 497 L 245 497"/>
  <path class="line" d="M 390 497 L 435 497"/>
  <path class="line" d="M 555 497 L 600 497"/>
  <path class="line" d="M 745 497 L 790 497"/>
  <path class="line" d="M 935 497 L 975 497"/>
  <path class="line" d="M 1048 539 L 1048 585"/>
  <path class="line" d="M 975 612 L 940 612"/>
  <path class="line" d="M 790 612 L 745 612"/>
  <path class="line-soft" d="M 910 274 C 855 342, 610 395, 520 470"/>

  <text class="small" x="302" y="682">FIG-026-002 - Un RAG robuste mesure retrieval, ranking, contexte, génération et usage réel des sources.</text>
</svg>
