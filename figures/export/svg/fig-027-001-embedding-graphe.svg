<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-027-001 - Embeddings vs graphes conceptuels</title>
  <desc id="desc">Comparaison entre une représentation par voisinage vectoriel et une représentation par graphe de relations typées.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #fbfcff; }
      .panel-vector { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .panel-graph { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; marker-end: url(#arrow); }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #1e293b; }
      .text { font: 400 12px Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .vector-dot { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.2; }
      .query-dot { fill: #f97316; stroke: #ea580c; stroke-width: 1.2; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .node-graph { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; }
      .node-core { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .rel { font: 400 11px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720"/>
  <text class="title" x="42" y="48">Embeddings vs graphes conceptuels</text>
  <text class="subtitle" x="42" y="72">Le vecteur donne une proximité ; le graphe explicite des relations typées et sourcées.</text>

  <rect class="panel-vector" x="60" y="120" width="520" height="495" rx="10"/>
  <text class="label" x="90" y="158">Espace d'embedding</text>
  <text class="small" x="90" y="180">Position continue, voisinage, similarité cosinus.</text>
  <line class="grid" x1="115" y1="510" x2="520" y2="510"/>
  <line class="grid" x1="115" y1="410" x2="520" y2="410"/>
  <line class="grid" x1="115" y1="310" x2="520" y2="310"/>
  <line class="grid" x1="215" y1="225" x2="215" y2="545"/>
  <line class="grid" x1="315" y1="225" x2="315" y2="545"/>
  <line class="grid" x1="415" y1="225" x2="415" y2="545"/>
  <line class="axis" x1="115" y1="545" x2="525" y2="545"/>
  <line class="axis" x1="115" y1="545" x2="115" y2="220"/>

  <circle class="query-dot" cx="290" cy="388" r="13"/>
  <text class="text" x="307" y="392">requête</text>
  <circle class="vector-dot" cx="240" cy="335" r="11"/>
  <text class="text" x="168" y="332">concept A</text>
  <circle class="vector-dot" cx="356" cy="360" r="11"/>
  <text class="text" x="370" y="364">concept B</text>
  <circle class="vector-dot" cx="445" cy="250" r="11"/>
  <text class="text" x="458" y="254">concept C</text>
  <circle class="vector-dot" cx="188" cy="475" r="11"/>
  <text class="text" x="202" y="479">concept D</text>

  <path class="line-soft" d="M 290 388 L 240 335"/>
  <path class="line-soft" d="M 290 388 L 356 360"/>
  <text class="small" x="235" y="418">voisinage utile, mais relation implicite</text>

  <rect class="panel-graph" x="620" y="120" width="500" height="495" rx="10"/>
  <text class="label" x="650" y="158">Graphe conceptuel</text>
  <text class="small" x="650" y="180">Nœuds, relations nommées, provenance et statut.</text>

  <rect class="node-core" x="810" y="225" width="140" height="56" rx="8"/>
  <text class="text" x="856" y="258">RAG</text>
  <rect class="node-graph" x="680" y="350" width="150" height="56" rx="8"/>
  <text class="text" x="710" y="383">retrieval</text>
  <rect class="node" x="900" y="350" width="150" height="56" rx="8"/>
  <text class="text" x="927" y="383">documents</text>
  <rect class="node-graph" x="790" y="480" width="180" height="56" rx="8"/>
  <text class="text" x="822" y="513">réponse sourcée</text>

  <path class="line" d="M 838 281 L 780 350"/>
  <text class="rel" x="774" y="324">utilise</text>
  <path class="line" d="M 830 378 L 900 378"/>
  <text class="rel" x="846" y="366">récupère</text>
  <path class="line" d="M 960 406 L 910 480"/>
  <text class="rel" x="930" y="454">alimente</text>
  <path class="line" d="M 760 406 L 835 480"/>
  <text class="rel" x="760" y="453">assemble</text>

  <path class="line-soft" d="M 530 390 C 585 390, 610 300, 810 255"/>
  <text class="small" x="530" y="365">la proximité peut suggérer une relation, pas la valider</text>

  <text class="small" x="250" y="664">FIG-027-001 - Un embedding cherche des voisins ; un graphe force à nommer les relations.</text>
</svg>
