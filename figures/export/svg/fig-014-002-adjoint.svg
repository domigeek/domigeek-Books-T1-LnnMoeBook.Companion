<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-014-002 - Méthode adjointe</title>
  <desc id="desc">Schéma de la méthode adjointe : résolution vers l'avant, calcul de la perte, puis intégration arrière pour les gradients.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .forward { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .backward { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .loss { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .memory { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .axis { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
      .greenLine { fill: none; stroke: #047857; stroke-width: 3; marker-end: url(#greenArrow); }
      .orangeLine { fill: none; stroke: #ea580c; stroke-width: 3; marker-end: url(#orangeArrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .tick { stroke: #374151; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="54">Méthode adjointe : entraîner une Neural ODE sans tout stocker</text>
  <text class="subtitle" x="48" y="82">Le passage avant résout l'ODE ; le passage arrière résout un système adjoint pour accumuler les gradients.</text>

  <rect class="panel" x="60" y="125" width="1080" height="500" rx="14"/>

  <text class="label" x="90" y="165">1. Passage avant</text>
  <line class="axis" x1="130" y1="255" x2="1040" y2="255"/>
  <text class="small" x="1032" y="285">temps</text>

  <line class="tick" x1="190" y1="240" x2="190" y2="270"/>
  <line class="tick" x1="405" y1="240" x2="405" y2="270"/>
  <line class="tick" x1="620" y1="240" x2="620" y2="270"/>
  <line class="tick" x1="835" y1="240" x2="835" y2="270"/>
  <line class="tick" x1="980" y1="240" x2="980" y2="270"/>
  <text class="math" x="178" y="298">t_0</text>
  <text class="math" x="965" y="298">t_1</text>

  <rect class="forward" x="145" y="185" width="170" height="55" rx="8"/>
  <text class="math" x="184" y="218">h(t_0)</text>
  <path class="greenLine" d="M315 213 C430 170 575 170 690 213"/>
  <rect class="forward" x="690" y="185" width="170" height="55" rx="8"/>
  <text class="math" x="729" y="218">h(t_1)</text>
  <rect class="loss" x="910" y="178" width="145" height="70" rx="8"/>
  <text class="math" x="954" y="207">L</text>
  <text class="small" x="936" y="229">perte finale</text>
  <path class="greenLine" d="M860 213 H910"/>

  <rect class="memory" x="142" y="330" width="345" height="62" rx="8"/>
  <text class="small" x="165" y="356">Option directe : stocker tous les états du solveur</text>
  <text class="small" x="165" y="378">puis rétropropager dans les opérations numériques.</text>

  <rect class="backward" x="560" y="330" width="395" height="62" rx="8"/>
  <text class="small" x="585" y="356">Option adjointe : repartir de la sensibilité finale</text>
  <text class="math" x="585" y="379">a(t_1) = dL/dh(t_1)</text>

  <text class="label" x="90" y="455">2. Passage arrière</text>
  <path class="orangeLine" d="M980 520 C800 455 610 455 190 520"/>
  <rect class="backward" x="850" y="485" width="160" height="60" rx="8"/>
  <text class="math" x="887" y="520">a(t_1)</text>
  <rect class="backward" x="395" y="485" width="190" height="60" rx="8"/>
  <text class="math" x="420" y="513">ODE arrière</text>
  <text class="small" x="420" y="535">sensibilités et gradients</text>
  <rect class="backward" x="130" y="485" width="160" height="60" rx="8"/>
  <text class="math" x="167" y="520">a(t_0)</text>

  <path class="dash" d="M585 392 C690 430 795 455 875 485"/>
  <rect class="memory" x="675" y="565" width="350" height="42" rx="8"/>
  <text class="small" x="700" y="591">Moins de stockage possible, mais plus de dépendance au solveur.</text>

  <text class="small" x="452" y="660">FIG-014-002 - Méthode adjointe</text>
</svg>
