<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FIG-012-001 - Équation d'état et flux séquentiel</title>
  <desc id="desc">Schéma d'un State Space Model : entrée, état précédent, transition d'état, état courant, sortie et passage au pas suivant.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .input { fill: #ecfdf5; stroke: #059669; stroke-width: 2; filter: url(#shadow); }
      .state { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; filter: url(#shadow); }
      .calc { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; filter: url(#shadow); }
      .noteBox { fill: #f8fafc; stroke: #64748b; stroke-width: 1.6; }
      .label { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #0f172a; }
      .line { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .softLine { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 6; marker-end: url(#softArrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="48" y="54">State Space Model : un état compact qui évolue avec l'entrée</text>
  <text class="subtitle" x="48" y="82">À chaque pas, l'entrée modifie l'état latent ; la sortie est une lecture de cet état.</text>

  <rect class="input" x="62" y="250" width="180" height="96" rx="12"/>
  <text class="label" x="116" y="285">Entrée</text>
  <text class="math" x="132" y="309">u_t</text>
  <text class="small" x="93" y="330">token, mesure,</text>
  <text class="small" x="107" y="349">événement</text>

  <rect class="state" x="300" y="250" width="190" height="96" rx="12"/>
  <text class="label" x="343" y="285">État précédent</text>
  <text class="math" x="374" y="315">s_{t-1}</text>

  <rect class="calc" x="558" y="218" width="300" height="160" rx="16"/>
  <text class="label" x="634" y="256">Transition d'état</text>
  <text class="math" x="610" y="292">s_t = A_bar s_{t-1}</text>
  <text class="math" x="662" y="318">+ B_bar u_t</text>
  <text class="small" x="603" y="350">l'état accumule une version</text>
  <text class="small" x="635" y="369">compressée du passé</text>

  <rect class="state" x="926" y="250" width="190" height="96" rx="12"/>
  <text class="label" x="975" y="285">État courant</text>
  <text class="math" x="1006" y="315">s_t</text>

  <rect class="input" x="926" y="430" width="190" height="96" rx="12"/>
  <text class="label" x="1000" y="465">Sortie</text>
  <text class="math" x="970" y="494">y_t = C s_t + D u_t</text>

  <rect class="state" x="558" y="468" width="300" height="82" rx="12"/>
  <text class="label" x="655" y="501">Pas suivant</text>
  <text class="small" x="622" y="527">s_t devient l'état précédent</text>

  <path class="line" d="M242 298 L300 298"/>
  <path class="line" d="M490 298 L558 298"/>
  <path class="line" d="M858 298 L926 298"/>
  <path class="line" d="M1021 346 L1021 430"/>
  <path class="line" d="M242 298 C395 416 750 426 926 477"/>
  <path class="softLine" d="M1021 346 C1005 420 916 506 858 509"/>
  <path class="softLine" d="M558 509 C430 502 352 413 374 347"/>

  <rect class="noteBox" x="264" y="118" width="672" height="58" rx="10"/>
  <text class="small" x="302" y="151">Le passé n'est pas gardé brut : il est compressé dans un état latent, utile mais non équivalent à une mémoire auditable.</text>

  <text class="small" x="444" y="640">FIG-012-001 - Équation d'état et flux séquentiel</text>
</svg>
