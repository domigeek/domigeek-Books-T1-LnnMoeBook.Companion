<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-016-003 - Architecture interne d'un LTC</title>
  <desc id="desc">Relations internes entre entrée, état, fonction de modulation, constante temporelle effective, dérivée, solveur et sortie dans un LTC.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .input { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .state { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .ltc { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .out { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .neutral { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .line { fill: none; stroke: #374151; stroke-width: 2.2; marker-end: url(#arrow); }
      .orangeLine { fill: none; stroke: #ea580c; stroke-width: 2.5; marker-end: url(#orangeArrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="54">Architecture interne d'un LTC</text>
  <text class="subtitle" x="48" y="82">La fonction apprise module une dynamique de premier ordre, puis le solveur intègre l'état.</text>

  <rect class="panel" x="60" y="125" width="1080" height="505" rx="14"/>

  <rect class="input" x="95" y="220" width="145" height="70" rx="10"/>
  <text class="math" x="133" y="252">x(t)</text>
  <text class="small" x="122" y="275">entrée</text>

  <rect class="state" x="95" y="390" width="145" height="70" rx="10"/>
  <text class="math" x="133" y="422">h(t)</text>
  <text class="small" x="113" y="445">état courant</text>

  <rect class="ltc" x="315" y="250" width="245" height="105" rx="12"/>
  <text class="math" x="348" y="285">f_θ(h(t), x(t), t)</text>
  <text class="small" x="350" y="310">fonction de modulation</text>
  <text class="small" x="350" y="332">couplage non linéaire</text>

  <rect class="neutral" x="315" y="420" width="245" height="76" rx="10"/>
  <text class="math" x="348" y="452">A - h(t)</text>
  <text class="small" x="350" y="474">distance vers une cible</text>

  <rect class="ltc" x="630" y="260" width="270" height="135" rx="12"/>
  <text class="math" x="662" y="300">dh/dt = -h/τ + f_θ(...) * (A-h)</text>
  <text class="small" x="662" y="328">dérivée de l'état</text>
  <text class="small" x="662" y="350">constante temporelle effective</text>
  <text class="small" x="662" y="372">dépendante du contexte</text>

  <rect class="neutral" x="630" y="455" width="270" height="76" rx="10"/>
  <text class="math" x="662" y="487">ODESolve(dh/dt)</text>
  <text class="small" x="662" y="509">intégration numérique</text>

  <rect class="state" x="980" y="300" width="120" height="70" rx="10"/>
  <text class="math" x="1003" y="333">h(t+dt)</text>
  <text class="small" x="1002" y="355">nouvel état</text>

  <rect class="out" x="980" y="455" width="120" height="70" rx="10"/>
  <text class="math" x="1018" y="488">y(t)</text>
  <text class="small" x="1008" y="510">sortie</text>

  <path class="line" d="M240 255 H315"/>
  <path class="line" d="M240 425 H315"/>
  <path class="line" d="M560 302 H630"/>
  <path class="line" d="M560 458 C600 440 608 390 630 360"/>
  <path class="orangeLine" d="M765 395 V455"/>
  <path class="line" d="M900 492 C950 475 962 400 980 350"/>
  <path class="line" d="M1040 370 V455"/>
  <path class="dash" d="M1040 300 C1038 190 770 180 575 190 C350 205 170 185 168 220"/>

  <rect class="neutral" x="185" y="565" width="830" height="44" rx="8"/>
  <text class="small" x="215" y="592">Lecture : la modulation f_θ change la dynamique effective ; le solveur transforme cette dérivée en trajectoire d'état.</text>

  <text class="small" x="415" y="660">FIG-016-003 - Architecture interne d'un LTC</text>
</svg>
