<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">FIG-009-002 - Flux d'information LSTM</title>
  <desc id="desc">Visualisation du flux d'information dans une cellule LSTM : conservation, ajout et exposition de l'état caché.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 18px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .mathSmall { font: 500 14px "Consolas", "Cascadia Mono", monospace; fill: #374151; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .state { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .gate { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .candidate { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .output { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .op { fill: #ffffff; stroke: #374151; stroke-width: 2; }
      .line { fill: none; stroke: #374151; stroke-width: 2.1; marker-end: url(#arrow); }
      .greenLine { fill: none; stroke: #047857; stroke-width: 3; marker-end: url(#greenArrow); }
      .orangeLine { fill: none; stroke: #ea580c; stroke-width: 2.4; marker-end: url(#orangeArrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="48" y="54">Flux d'information dans un LSTM</text>
  <text class="subtitle" x="48" y="82">Le cell state transporte l'information ; les portes contrôlent la conservation, l'ajout et l'exposition.</text>

  <rect class="panel" x="70" y="135" width="1060" height="390" rx="14"/>
  <text class="section" x="96" y="170">Pas de temps t : mise à jour structurée</text>

  <rect class="state" x="105" y="225" width="110" height="58" rx="8"/>
  <text class="math" x="134" y="260">c_{t-1}</text>
  <path class="greenLine" d="M215 254 H310"/>

  <circle class="op" cx="338" cy="254" r="25"/>
  <text class="math" x="330" y="260">×</text>
  <rect class="gate" x="280" y="315" width="175" height="70" rx="8"/>
  <text class="label" x="322" y="343">Conserver</text>
  <text class="mathSmall" x="319" y="366">f_t * c_{t-1}</text>
  <path class="line" d="M368 315 V280"/>

  <path class="greenLine" d="M363 254 H545"/>
  <circle class="op" cx="575" cy="254" r="26"/>
  <text class="math" x="566" y="260">+</text>
  <path class="greenLine" d="M601 254 H770"/>

  <rect class="state" x="770" y="225" width="92" height="58" rx="8"/>
  <text class="math" x="798" y="260">c_t</text>
  <path class="greenLine" d="M862 254 H995"/>
  <rect class="state" x="995" y="225" width="92" height="58" rx="8"/>
  <text class="mathSmall" x="1012" y="260">c_{t+1}</text>

  <rect class="candidate" x="500" y="315" width="185" height="70" rx="8"/>
  <text class="label" x="547" y="343">Ajouter</text>
  <text class="mathSmall" x="532" y="366">i_t * g_t</text>
  <path class="orangeLine" d="M592 315 V282"/>

  <rect class="gate" x="105" y="430" width="250" height="58" rx="8"/>
  <text class="mathSmall" x="138" y="454">f_t = σ(W_f[x_t,h_{t-1}] + b_f)</text>
  <text class="small" x="153" y="476">porte d'oubli</text>

  <rect class="gate" x="395" y="430" width="250" height="58" rx="8"/>
  <text class="mathSmall" x="428" y="454">i_t = σ(W_i[x_t,h_{t-1}] + b_i)</text>
  <text class="small" x="448" y="476">porte d'entrée</text>

  <rect class="candidate" x="685" y="430" width="250" height="58" rx="8"/>
  <text class="mathSmall" x="722" y="454">g_t = tanh(W_g[x_t,h_{t-1}] + b_g)</text>
  <text class="small" x="762" y="476">contenu candidat</text>

  <path class="dash" d="M230 430 C250 395 300 385 338 280"/>
  <path class="dash" d="M520 430 C530 395 560 384 590 385"/>
  <path class="dash" d="M810 430 C760 395 690 384 618 385"/>

  <path class="line" d="M816 283 C816 335 785 360 740 380"/>
  <rect class="output" x="742" y="324" width="198" height="70" rx="8"/>
  <text class="label" x="787" y="352">Exposer</text>
  <text class="mathSmall" x="769" y="376">h_t = o_t * tanh(c_t)</text>
  <rect class="gate" x="970" y="324" width="110" height="70" rx="8"/>
  <text class="math" x="1007" y="354">o_t</text>
  <text class="small" x="990" y="377">sortie</text>
  <path class="line" d="M970 359 H940"/>
  <path class="line" d="M940 359 C965 402 990 430 1014 457"/>
  <rect class="output" x="1014" y="430" width="92" height="54" rx="8"/>
  <text class="math" x="1046" y="464">h_t</text>

  <rect class="panel" x="70" y="550" width="540" height="58" rx="10"/>
  <text class="small" x="96" y="574">Le point important n'est pas seulement la mémoire.</text>
  <text class="small" x="96" y="596">C'est la mise à jour contrôlée d'un état latent à chaque pas.</text>

  <text class="small" x="432" y="632">FIG-009-002 - Flux d'information LSTM</text>
</svg>
