<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-026-003 - Contamination mémoire et oubli contrôlé</title>
  <desc id="desc">Flux de contrôle pour éviter qu'une entrée non fiable contamine la mémoire persistante et pour vérifier l'oubli contrôlé.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #fbfcff; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #1e293b; }
      .text { font: 400 12px Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .risk { font: 400 12px Arial, sans-serif; fill: #7f1d1d; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .input { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .danger { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
      .gate { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .ok { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; }
      .memory { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .audit { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .line { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .line-red { stroke: #dc2626; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720"/>
  <text class="title" x="42" y="48">Contamination mémoire et oubli contrôlé</text>
  <text class="subtitle" x="42" y="72">Une écriture persistante doit passer par source, validation, durée de vie et audit.</text>

  <rect class="input" x="70" y="245" width="165" height="82" rx="8"/>
  <text class="label" x="104" y="278">Entrée</text>
  <text class="text" x="98" y="302">interaction</text>
  <text class="small" x="98" y="320">ou document</text>

  <rect class="danger" x="295" y="220" width="185" height="132" rx="8"/>
  <text class="label" x="326" y="255">Détection</text>
  <text class="risk" x="324" y="282">injection</text>
  <text class="risk" x="324" y="304">secret accidentel</text>
  <text class="risk" x="324" y="326">donnée périmée</text>

  <rect class="gate" x="545" y="235" width="180" height="102" rx="8"/>
  <text class="label" x="585" y="270">Gate d'écriture</text>
  <text class="text" x="575" y="296">règles, droits</text>
  <text class="small" x="575" y="316">source + portée + TTL</text>

  <rect class="node" x="805" y="150" width="190" height="86" rx="8"/>
  <text class="label" x="842" y="185">Épisodique</text>
  <text class="text" x="833" y="210">trace horodatée</text>

  <rect class="ok" x="805" y="285" width="190" height="86" rx="8"/>
  <text class="label" x="846" y="320">Validation</text>
  <text class="text" x="835" y="345">humaine ou politique</text>

  <rect class="memory" x="545" y="485" width="210" height="94" rx="8"/>
  <text class="label" x="590" y="520">Persistante</text>
  <text class="text" x="582" y="544">faits, préférences</text>
  <text class="small" x="582" y="564">règles et synthèses</text>

  <rect class="node" x="305" y="488" width="180" height="88" rx="8"/>
  <text class="label" x="344" y="523">Oubli contrôlé</text>
  <text class="text" x="336" y="548">expiration, suppression</text>

  <rect class="audit" x="70" y="490" width="165" height="86" rx="8"/>
  <text class="label" x="113" y="525">Audit</text>
  <text class="text" x="98" y="550">logs, preuves, tests</text>

  <path class="line" d="M 235 286 L 295 286"/>
  <path class="line" d="M 480 286 L 545 286"/>
  <path class="line" d="M 725 270 C 760 230, 780 205, 805 195"/>
  <path class="line" d="M 725 305 L 805 328"/>
  <path class="line" d="M 900 371 C 830 435, 745 485, 755 530"/>
  <path class="line" d="M 545 532 L 485 532"/>
  <path class="line" d="M 305 532 L 235 532"/>
  <path class="line-soft" d="M 152 490 C 190 420, 385 410, 545 315"/>
  <path class="line-red" d="M 387 352 C 410 420, 530 440, 625 485"/>

  <text class="small" x="312" y="664">FIG-026-003 - La mémoire persistante doit être plus difficile à écrire qu'à lire.</text>
</svg>
