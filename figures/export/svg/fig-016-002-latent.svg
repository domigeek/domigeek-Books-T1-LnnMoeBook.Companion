<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-016-002 - Trajectoires latentes LNN</title>
  <desc id="desc">Trajectoires latentes pédagogiques montrant deux régimes dynamiques, des perturbations et une limite d'interprétation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .axis { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
      .grid { stroke: #dbe4f0; stroke-width: 1.2; }
      .trajA { fill: none; stroke: #047857; stroke-width: 4; marker-end: url(#arrow); }
      .trajB { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow); }
      .pert { fill: none; stroke: #ea580c; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .dotA { fill: #ecfdf5; stroke: #047857; stroke-width: 3; }
      .dotB { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .dotP { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; }
      .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .legendA { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .legendB { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 14px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="48" y="54">Trajectoires latentes LNN</text>
  <text class="subtitle" x="48" y="82">Visualiser l'état peut aider l'analyse, mais une trajectoire n'est pas une explication complète.</text>

  <rect class="panel" x="70" y="125" width="1060" height="530" rx="14"/>

  <line class="grid" x1="160" y1="535" x2="795" y2="535"/>
  <line class="grid" x1="160" y1="445" x2="795" y2="445"/>
  <line class="grid" x1="160" y1="355" x2="795" y2="355"/>
  <line class="grid" x1="160" y1="265" x2="795" y2="265"/>
  <line class="grid" x1="240" y1="185" x2="240" y2="535"/>
  <line class="grid" x1="360" y1="185" x2="360" y2="535"/>
  <line class="grid" x1="480" y1="185" x2="480" y2="535"/>
  <line class="grid" x1="600" y1="185" x2="600" y2="535"/>
  <line class="grid" x1="720" y1="185" x2="720" y2="535"/>

  <line class="axis" x1="160" y1="535" x2="820" y2="535"/>
  <line class="axis" x1="160" y1="535" x2="160" y2="180"/>
  <text class="small" x="640" y="565">dimension latente 1</text>
  <text class="small" x="105" y="185">dimension latente 2</text>

  <path class="trajA" d="M210 480 C260 430 290 395 340 405 C410 420 455 350 485 295 C525 225 590 230 645 275"/>
  <path class="trajB" d="M230 290 C285 250 355 230 420 250 C500 275 535 355 590 400 C650 450 710 430 765 365"/>
  <path class="pert" d="M485 295 C545 325 590 345 650 330"/>

  <circle class="dotA" cx="210" cy="480" r="8"/>
  <circle class="dotA" cx="340" cy="405" r="8"/>
  <circle class="dotA" cx="485" cy="295" r="8"/>
  <circle class="dotA" cx="645" cy="275" r="8"/>

  <circle class="dotB" cx="230" cy="290" r="8"/>
  <circle class="dotB" cx="420" cy="250" r="8"/>
  <circle class="dotB" cx="590" cy="400" r="8"/>
  <circle class="dotB" cx="765" cy="365" r="8"/>

  <circle class="dotP" cx="650" cy="330" r="8"/>

  <rect class="legendA" x="870" y="205" width="34" height="24" rx="4"/>
  <text class="small" x="918" y="223">régime A : trajectoire nominale</text>
  <rect class="legendB" x="870" y="250" width="34" height="24" rx="4"/>
  <text class="small" x="918" y="268">régime B : autre contexte</text>
  <rect class="note" x="850" y="340" width="260" height="104" rx="8"/>
  <text class="small" x="872" y="368">Lecture prudente :</text>
  <text class="small" x="872" y="390">une séparation visuelle aide,</text>
  <text class="small" x="872" y="412">mais ne prouve pas une cause</text>
  <text class="small" x="872" y="434">ni une explication métier.</text>

  <rect class="panel" x="850" y="485" width="260" height="80" rx="8"/>
  <text class="small" x="872" y="512">À compléter par :</text>
  <text class="small" x="872" y="534">perturbations, logs, métriques,</text>
  <text class="small" x="872" y="556">cas d'échec et baselines.</text>

  <text class="math" x="530" y="330">perturbation</text>
  <text class="small" x="420" y="690">FIG-016-002 - Trajectoires latentes LNN</text>
</svg>
