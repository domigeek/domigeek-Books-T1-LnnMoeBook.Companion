<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-032-002 - Mémoire conceptuelle évolutive</title>
  <desc id="desc">Versionnement d'une mémoire conceptuelle avec sources, concepts, embeddings, relations, révisions, historique et oubli contrôlé.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #fbfcff; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #1e293b; }
      .text { font: 400 12px Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .source { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .concept { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .embedding { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; }
      .relation { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .revision { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
      .audit { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .forget { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; }
      .line { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .line-red { stroke: #dc2626; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720"/>
  <text class="title" x="42" y="48">Mémoire conceptuelle évolutive</text>
  <text class="subtitle" x="42" y="72">Un concept technique doit garder sources, versions, relations, modèle d'embedding et politique d'oubli.</text>

  <rect class="source" x="70" y="220" width="170" height="92" rx="8"/>
  <text class="label" x="118" y="255">Sources</text>
  <text class="text" x="102" y="280">articles, épisodes</text>
  <text class="small" x="102" y="300">règles et validations</text>

  <rect class="concept" x="315" y="190" width="190" height="112" rx="8"/>
  <text class="label" x="362" y="228">Concept v1</text>
  <text class="text" x="345" y="254">libellé initial</text>
  <text class="text" x="345" y="276">définition provisoire</text>

  <rect class="embedding" x="585" y="145" width="190" height="92" rx="8"/>
  <text class="label" x="638" y="180">Embedding</text>
  <text class="text" x="620" y="204">modèle, version, date</text>

  <rect class="relation" x="585" y="290" width="190" height="98" rx="8"/>
  <text class="label" x="630" y="326">Relations</text>
  <text class="text" x="620" y="350">type, source, statut</text>
  <text class="small" x="620" y="370">confiance + contexte</text>

  <rect class="revision" x="860" y="220" width="190" height="92" rx="8"/>
  <text class="label" x="915" y="255">Révision</text>
  <text class="text" x="895" y="280">source nouvelle</text>
  <text class="small" x="895" y="300">ou contradiction</text>

  <rect class="concept" x="860" y="420" width="190" height="108" rx="8"/>
  <text class="label" x="913" y="458">Concept v2</text>
  <text class="text" x="895" y="482">consolidation</text>
  <text class="small" x="895" y="502">corrigée et sourcée</text>

  <rect class="audit" x="315" y="455" width="190" height="92" rx="8"/>
  <text class="label" x="358" y="490">Historique</text>
  <text class="text" x="350" y="514">provenance</text>
  <text class="small" x="350" y="534">rollback possible</text>

  <rect class="forget" x="585" y="500" width="190" height="82" rx="8"/>
  <text class="label" x="628" y="535">Oubli contrôlé</text>
  <text class="text" x="620" y="558">expiration, invalidation</text>

  <path class="line" d="M 240 266 L 315 246"/>
  <path class="line" d="M 505 228 L 585 191"/>
  <path class="line" d="M 505 276 L 585 338"/>
  <path class="line" d="M 775 338 C 825 330, 845 302, 860 277"/>
  <path class="line" d="M 955 312 L 955 420"/>
  <path class="line-soft" d="M 860 458 C 760 430, 710 310, 700 237"/>
  <path class="line-soft" d="M 860 492 C 760 460, 720 395, 700 388"/>
  <path class="line-soft" d="M 410 302 L 410 455"/>
  <path class="line-soft" d="M 860 500 C 720 625, 510 570, 505 520"/>
  <path class="line" d="M 505 512 L 585 535"/>
  <path class="line-red" d="M 585 540 C 500 610, 275 610, 190 312"/>

  <text class="small" x="278" y="664">FIG-032-002 - Faire évoluer un concept sans historique, c'est perdre la capacité de corriger le système.</text>
</svg>
