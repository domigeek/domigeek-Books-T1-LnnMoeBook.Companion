<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-024-001 - Couche Sparsely-Gated MoE</title>
  <desc id="desc">Schéma montrant routeur, dispatch sparse, experts actifs, experts inactifs et recombinaison dans une couche Sparsely-Gated MoE.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .block { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .tokens { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .router { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .dispatch { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .active { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .inactive { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .mix { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .label { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .math { font: 600 13px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .line { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="48" y="54">Couche Sparsely-Gated MoE</text>
  <text class="subtitle" x="48" y="82">Une couche sparse MoE est un pipeline : routeur, dispatch, experts actifs, recombinaison.</text>

  <rect class="panel" x="60" y="120" width="1080" height="520" rx="14"/>

  <rect class="tokens" x="95" y="260" width="130" height="150" rx="14"/>
  <text class="label" x="130" y="292">Tokens</text>
  <text class="math" x="125" y="325">t0 t1 t2</text>
  <text class="math" x="125" y="350">t3 t4 t5</text>
  <text class="small" x="122" y="384">batch d'entrée</text>

  <rect class="router" x="285" y="245" width="160" height="180" rx="14"/>
  <text class="label" x="337" y="282">Routeur</text>
  <text class="math" x="322" y="313">scores</text>
  <text class="math" x="322" y="338">top-k</text>
  <text class="math" x="322" y="363">capacité</text>
  <text class="small" x="314" y="392">sélection par token</text>

  <rect class="dispatch" x="510" y="195" width="180" height="270" rx="14"/>
  <text class="label" x="555" y="228">Dispatch</text>
  <text class="math" x="540" y="266">E1 &lt;- t0,t4</text>
  <text class="math" x="540" y="306">E2 &lt;- t1</text>
  <text class="math" x="540" y="346">E3 &lt;- --</text>
  <text class="math" x="540" y="386">E4 &lt;- t2,t3,t5</text>
  <text class="small" x="540" y="428">regrouper par expert</text>

  <rect class="active" x="760" y="145" width="150" height="70" rx="12"/>
  <text class="label" x="800" y="175">Expert 1</text>
  <text class="small" x="795" y="198">actif</text>
  <rect class="active" x="760" y="260" width="150" height="70" rx="12"/>
  <text class="label" x="800" y="290">Expert 2</text>
  <text class="small" x="795" y="313">actif</text>
  <rect class="inactive" x="760" y="375" width="150" height="70" rx="12"/>
  <text class="label" x="800" y="405">Expert 3</text>
  <text class="small" x="786" y="428">non exécuté</text>
  <rect class="active" x="760" y="490" width="150" height="70" rx="12"/>
  <text class="label" x="800" y="520">Expert 4</text>
  <text class="small" x="795" y="543">actif</text>

  <rect class="mix" x="990" y="295" width="105" height="95" rx="12"/>
  <text class="label" x="1010" y="330">Recom-</text>
  <text class="label" x="1010" y="352">binaison</text>
  <text class="small" x="1015" y="375">ordre initial</text>

  <path class="line" d="M225 335 H285"/>
  <path class="line" d="M445 335 H510"/>
  <path class="line" d="M690 266 C730 235 742 180 760 180"/>
  <path class="line" d="M690 306 C730 300 742 295 760 295"/>
  <path class="dash" d="M690 346 C730 365 742 410 760 410"/>
  <path class="line" d="M690 386 C730 445 742 525 760 525"/>
  <path class="line" d="M910 180 C955 210 970 300 990 320"/>
  <path class="line" d="M910 295 H990"/>
  <path class="line" d="M910 525 C955 495 970 385 990 365"/>

  <rect class="block" x="210" y="585" width="820" height="46" rx="9"/>
  <text class="small" x="250" y="613">Point clé : les experts non sélectionnés ne calculent rien pour ce batch, mais le dispatch et la recombinaison ont un coût.</text>

  <text class="small" x="395" y="690">FIG-024-001 - Couche Sparsely-Gated MoE</text>
</svg>
