  <title id="title">FIG-036-001 - Solution TorchSharp compagnon</title>
  <desc id="desc">Structure de la solution C# TorchSharp compagnon : Core, Examples, Tests, CLI, Benchmarks, données synthétiques et commandes.</desc>
  <defs>
