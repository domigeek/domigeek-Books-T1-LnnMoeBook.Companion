<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-017-002 - Gate network historique</title>
  <desc id="desc">Schéma montrant une entrée, un gate network, plusieurs experts locaux et une combinaison pondérée des sorties.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .input { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .gate { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .expert { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .mix { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .out { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .neutral { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .line { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .blueLine { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#blueArrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="48" y="54">Gate network historique : pondérer plusieurs experts</text>
  <text class="subtitle" x="48" y="82">Le gate produit des poids ; les experts produisent des sorties ; la sortie finale est une combinaison.</text>

  <rect class="panel" x="60" y="125" width="1080" height="510" rx="14"/>

  <rect class="input" x="105" y="310" width="150" height="82" rx="12"/>
  <text class="math" x="161" y="345">x</text>
  <text class="small" x="132" y="370">entrée</text>

  <rect class="gate" x="330" y="195" width="220" height="110" rx="14"/>
  <text class="label" x="378" y="228">Gate network</text>
  <text class="math" x="366" y="258">g(x)=softmax(...)</text>
  <text class="small" x="372" y="283">poids de routage</text>

  <rect class="expert" x="640" y="160" width="180" height="74" rx="12"/>
  <text class="label" x="696" y="190">Expert 1</text>
  <text class="math" x="704" y="214">f_1(x)</text>

  <rect class="expert" x="640" y="308" width="180" height="74" rx="12"/>
  <text class="label" x="696" y="338">Expert 2</text>
  <text class="math" x="704" y="362">f_2(x)</text>

  <rect class="expert" x="640" y="456" width="180" height="74" rx="12"/>
  <text class="label" x="696" y="486">Expert 3</text>
  <text class="math" x="704" y="510">f_3(x)</text>

  <rect class="mix" x="900" y="285" width="180" height="130" rx="14"/>
  <text class="label" x="940" y="318">Combinaison</text>
  <text class="math" x="928" y="350">Σ g_i(x) f_i(x)</text>
  <text class="small" x="930" y="382">dense ici</text>

  <rect class="out" x="980" y="500" width="100" height="70" rx="12"/>
  <text class="math" x="1020" y="532">y</text>
  <text class="small" x="1006" y="554">sortie</text>

  <rect class="neutral" x="320" y="510" width="250" height="64" rx="10"/>
  <text class="small" x="344" y="537">Version moderne sparse :</text>
  <text class="math" x="344" y="560">S(x)=top-k(g(x))</text>

  <path class="line" d="M255 350 H330"/>
  <path class="line" d="M255 350 C390 350 500 185 640 195"/>
  <path class="line" d="M255 350 H640"/>
  <path class="line" d="M255 350 C390 350 500 500 640 493"/>

  <path class="blueLine" d="M550 235 C600 210 610 195 640 195"/>
  <path class="blueLine" d="M550 250 C600 290 610 345 640 345"/>
  <path class="blueLine" d="M550 265 C600 390 610 492 640 492"/>

  <text class="math" x="570" y="205">g_1</text>
  <text class="math" x="570" y="330">g_2</text>
  <text class="math" x="570" y="472">g_3</text>

  <path class="line" d="M820 197 C860 205 880 285 900 318"/>
  <path class="line" d="M820 345 H900"/>
  <path class="line" d="M820 493 C860 480 880 415 900 382"/>
  <path class="line" d="M990 415 V500"/>

  <text class="small" x="388" y="690">FIG-017-002 - Gate network historique</text>
</svg>
