<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="280" viewBox="0 0 1180 280" role="img" aria-labelledby="title desc">
  <title id="title">FIG-000-002 - Statuts de v&#233;rit&#233;</title>
  <desc id="desc">Figure p&#233;dagogique du Tome I.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; fill: #64748b; }
    .box-title { font-size: 15px; font-weight: 700; }
    .box-text { font-size: 12px; fill: #334155; }
    .small { font-size: 11px; fill: #475569; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>
  <text class="title" x="40" y="42">Statuts de v&#233;rit&#233; utilis&#233;s dans le livre</text>
  <text class="subtitle" x="40" y="64">Distinguer ce qui est &#233;tabli, publi&#233;, exp&#233;rimental, hypoth&#233;tique ou architectural.</text>
  <rect x="40" y="110" width="180" height="96" rx="8" fill="#e8f5f0" stroke="#2f7d5a" stroke-width="1.5"/>
  <text class="box-title" x="54" y="136">&#201;tabli</text>
  <text class="box-text" x="54" y="158">Base math&#233;matique</text>
  <text class="box-text" x="54" y="176">ou consensus solide</text>
  <path class="arrow" d="M220,158 L260,158"/>
  <rect x="265" y="110" width="180" height="96" rx="8" fill="#eef3ff" stroke="#4f68b8" stroke-width="1.5"/>
  <text class="box-title" x="279" y="136">Publi&#233;</text>
  <text class="box-text" x="279" y="158">Article ou protocole</text>
  <text class="box-text" x="279" y="176">avec limites connues</text>
  <path class="arrow" d="M445,158 L485,158"/>
  <rect x="490" y="110" width="180" height="96" rx="8" fill="#fff6df" stroke="#c48a1f" stroke-width="1.5"/>
  <text class="box-title" x="504" y="136">Exp&#233;rimental</text>
  <text class="box-text" x="504" y="158">R&#233;sultat observ&#233;</text>
  <text class="box-text" x="504" y="176">sur benchmark ou proto</text>
  <path class="arrow" d="M670,158 L710,158"/>
  <rect x="715" y="110" width="180" height="96" rx="8" fill="#f8e9ef" stroke="#b8537a" stroke-width="1.5"/>
  <text class="box-title" x="729" y="136">Hypoth&#232;se</text>
  <text class="box-text" x="729" y="158">Id&#233;e &#224; tester</text>
  <text class="box-text" x="729" y="176">sans preuve g&#233;n&#233;rale</text>
  <path class="arrow" d="M895,158 L935,158"/>
  <rect x="940" y="110" width="180" height="96" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="box-title" x="954" y="136">Architecture</text>
  <text class="box-text" x="954" y="158">Choix de conception</text>
  <text class="box-text" x="954" y="176">&#224; mesurer en pratique</text>
  <text class="small" x="40" y="245">Une hypoth&#232;se utile peut devenir un r&#233;sultat publi&#233;, mais seulement apr&#232;s protocole, mesure et revue critique.</text>
</svg>
