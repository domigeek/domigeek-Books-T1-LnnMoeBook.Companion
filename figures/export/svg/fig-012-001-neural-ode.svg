<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-012-001 - Neural ODE comme profondeur continue</title>
  <desc id="desc">Comparaison entre une pile de couches résiduelles discrètes et une Neural ODE vue comme une trajectoire continue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .block { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .state { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .ode { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 15px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
      .line { fill: none; stroke: #374151; stroke-width: 2.1; marker-end: url(#arrow); }
      .greenLine { fill: none; stroke: #047857; stroke-width: 3; marker-end: url(#greenArrow); }
      .skip { fill: none; stroke: #94a3b8; stroke-width: 1.8; marker-end: url(#arrow); stroke-dasharray: 7 7; }
      .curve { fill: none; stroke: #047857; stroke-width: 4; marker-end: url(#greenArrow); }
      .dot { fill: #ffffff; stroke: #047857; stroke-width: 3; }
      .axis { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
      .grid { stroke: #dbe4f0; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="54">Neural ODE : de la couche résiduelle à la trajectoire continue</text>
  <text class="subtitle" x="48" y="82">Une ResNet avance par corrections discrètes ; une Neural ODE apprend une dérivée et laisse un solveur intégrer la trajectoire.</text>

  <rect class="panel" x="55" y="125" width="520" height="480" rx="14"/>
  <text class="label" x="85" y="166">Vue discrète : couches résiduelles</text>
  <text class="small" x="85" y="190">La profondeur est fixée par le nombre de blocs.</text>

  <rect class="state" x="92" y="285" width="70" height="55" rx="8"/>
  <text class="math" x="112" y="318">h_0</text>
  <path class="line" d="M162 313 H210"/>
  <rect class="block" x="210" y="270" width="92" height="85" rx="8"/>
  <text class="math" x="231" y="306">f_θ</text>
  <text class="small" x="225" y="330">bloc 1</text>
  <path class="line" d="M302 313 H350"/>
  <rect class="block" x="350" y="270" width="92" height="85" rx="8"/>
  <text class="math" x="371" y="306">f_θ</text>
  <text class="small" x="365" y="330">bloc 2</text>
  <path class="line" d="M442 313 H490"/>
  <rect class="state" x="490" y="285" width="70" height="55" rx="8"/>
  <text class="math" x="510" y="318">h_N</text>

  <path class="skip" d="M127 285 C160 215 260 215 256 270"/>
  <path class="skip" d="M256 270 C275 215 395 215 396 270"/>
  <text class="small" x="190" y="230">connexions résiduelles</text>

  <rect class="ode" x="117" y="420" width="410" height="70" rx="10"/>
  <text class="math" x="150" y="448">h_{k+1} = h_k + Δt * f_θ(h_k, t_k)</text>
  <text class="small" x="150" y="472">Interprétation : un pas numérique explicite.</text>

  <rect class="panel" x="625" y="125" width="520" height="480" rx="14"/>
  <text class="label" x="655" y="166">Vue continue : dynamique apprise</text>
  <text class="small" x="655" y="190">Le solveur choisit les pas nécessaires pour intégrer.</text>

  <line class="axis" x1="705" y1="500" x2="1070" y2="500"/>
  <line class="axis" x1="705" y1="500" x2="705" y2="245"/>
  <text class="small" x="1060" y="528">t</text>
  <text class="small" x="670" y="250">h(t)</text>

  <line class="grid" x1="760" y1="245" x2="760" y2="500"/>
  <line class="grid" x1="835" y1="245" x2="835" y2="500"/>
  <line class="grid" x1="910" y1="245" x2="910" y2="500"/>
  <line class="grid" x1="985" y1="245" x2="985" y2="500"/>

  <path class="curve" d="M725 455 C770 380 820 365 850 395 C890 435 930 345 960 285 C995 220 1030 260 1060 315"/>
  <circle class="dot" cx="725" cy="455" r="7"/>
  <circle class="dot" cx="850" cy="395" r="7"/>
  <circle class="dot" cx="960" cy="285" r="7"/>
  <circle class="dot" cx="1060" cy="315" r="7"/>

  <rect class="ode" x="706" y="205" width="330" height="54" rx="8"/>
  <text class="math" x="732" y="238">dh(t)/dt = f_θ(h(t), t)</text>

  <rect class="state" x="740" y="530" width="330" height="50" rx="8"/>
  <text class="math" x="768" y="560">h(t_1) = ODESolve(f_θ, h(t_0), t_0, t_1)</text>

  <text class="small" x="390" y="660">FIG-012-001 - Neural ODE comme profondeur continue</text>
</svg>
