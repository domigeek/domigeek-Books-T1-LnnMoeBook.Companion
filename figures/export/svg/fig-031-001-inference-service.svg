<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-031-001 - Service d'inférence</title>
  <desc id="desc">Schéma d'un service d'inférence avec API, validation, budgets, file, runtime, modèle, appareil effectif et télémétrie.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; }
      .blue { fill: #e8f3ff; }
      .violet { fill: #f3eaff; }
      .green { fill: #ecfdf5; }
      .amber { fill: #fff7e6; }
      .red { fill: #fff1f2; }
      .title { font: 700 30px Arial, sans-serif; fill: #1e293b; }
      .label { font: 700 18px Arial, sans-serif; fill: #1e293b; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .caption { font: 15px Arial, sans-serif; fill: #64748b; }
      .edge { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <text x="60" y="58" class="title">Service d'inférence en production</text>
  <text x="60" y="84" class="caption">Le modèle est seulement une pièce du service : contrat, validation, budgets, runtime, métadonnées et télémétrie.</text>

  <rect x="60" y="145" width="135" height="90" class="box blue"/>
  <text x="128" y="177" text-anchor="middle" class="label">Client</text>
  <text x="128" y="204" text-anchor="middle" class="small">application</text>
  <text x="128" y="222" text-anchor="middle" class="small">ou agent</text>

  <rect x="245" y="145" width="150" height="90" class="box violet"/>
  <text x="320" y="174" text-anchor="middle" class="label">API</text>
  <text x="320" y="201" text-anchor="middle" class="small">contrat JSON</text>
  <text x="320" y="219" text-anchor="middle" class="small">versionné</text>

  <rect x="445" y="145" width="150" height="90" class="box"/>
  <text x="520" y="174" text-anchor="middle" class="label">Validation</text>
  <text x="520" y="201" text-anchor="middle" class="small">schéma, taille</text>
  <text x="520" y="219" text-anchor="middle" class="small">permissions</text>

  <rect x="645" y="145" width="150" height="90" class="box amber"/>
  <text x="720" y="174" text-anchor="middle" class="label">Budgets</text>
  <text x="720" y="201" text-anchor="middle" class="small">latence, coût</text>
  <text x="720" y="219" text-anchor="middle" class="small">file d'attente</text>

  <rect x="845" y="145" width="150" height="90" class="box"/>
  <text x="920" y="174" text-anchor="middle" class="label">File</text>
  <text x="920" y="201" text-anchor="middle" class="small">priorité</text>
  <text x="920" y="219" text-anchor="middle" class="small">backpressure</text>

  <rect x="445" y="330" width="190" height="100" class="box green"/>
  <text x="540" y="361" text-anchor="middle" class="label">Runtime</text>
  <text x="540" y="388" text-anchor="middle" class="small">modèle chargé</text>
  <text x="540" y="407" text-anchor="middle" class="small">warmup effectué</text>

  <rect x="700" y="330" width="170" height="100" class="box blue"/>
  <text x="785" y="361" text-anchor="middle" class="label">Modèle</text>
  <text x="785" y="388" text-anchor="middle" class="small">version effective</text>
  <text x="785" y="407" text-anchor="middle" class="small">artefact connu</text>

  <rect x="945" y="330" width="160" height="100" class="box violet"/>
  <text x="1025" y="361" text-anchor="middle" class="label">Réponse</text>
  <text x="1025" y="388" text-anchor="middle" class="small">résultat</text>
  <text x="1025" y="407" text-anchor="middle" class="small">métadonnées</text>

  <rect x="245" y="330" width="150" height="100" class="box"/>
  <text x="320" y="361" text-anchor="middle" class="label">Cache</text>
  <text x="320" y="388" text-anchor="middle" class="small">optionnel</text>
  <text x="320" y="407" text-anchor="middle" class="small">contrôlé</text>

  <rect x="445" y="510" width="190" height="90" class="box amber"/>
  <text x="540" y="540" text-anchor="middle" class="label">Appareil effectif</text>
  <text x="540" y="567" text-anchor="middle" class="small">CPU, CUDA</text>
  <text x="540" y="586" text-anchor="middle" class="small">ou fallback</text>

  <rect x="815" y="510" width="230" height="90" class="box green"/>
  <text x="930" y="540" text-anchor="middle" class="label">Télémétrie</text>
  <text x="930" y="567" text-anchor="middle" class="small">logs, métriques</text>
  <text x="930" y="586" text-anchor="middle" class="small">traces, erreurs</text>

  <rect x="70" y="510" width="225" height="90" class="box red"/>
  <text x="182" y="540" text-anchor="middle" class="label">Entraînement</text>
  <text x="182" y="567" text-anchor="middle" class="small">séparé du service</text>
  <text x="182" y="586" text-anchor="middle" class="small">pas caché en inférence</text>

  <path d="M195 190 H245" class="edge"/>
  <path d="M395 190 H445" class="edge"/>
  <path d="M595 190 H645" class="edge"/>
  <path d="M795 190 H845" class="edge"/>
  <path d="M920 235 V280 H540 V330" class="edge"/>
  <path d="M635 380 H700" class="edge"/>
  <path d="M870 380 H945" class="edge"/>
  <path d="M1025 330 V285 H128 V235" class="edge"/>
  <path d="M395 380 H445" class="dash"/>
  <path d="M540 430 V510" class="edge"/>
  <path d="M320 235 V330" class="dash"/>
  <path d="M520 235 V280 H900 V510" class="dash"/>
  <path d="M720 235 V260 H930 V510" class="dash"/>
  <path d="M1045 430 C1040 470 1005 495 970 510" class="dash"/>
  <path d="M295 555 C365 535 400 485 445 430" class="dash"/>

  <text x="600" y="660" text-anchor="middle" class="caption">FIG-031-001 - Service d'inférence</text>
</svg>
