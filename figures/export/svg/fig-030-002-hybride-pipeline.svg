<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">FIG-030-002 - Hybride dynamique vs pipeline statique</title>
  <desc id="desc">Comparaison entre un pipeline statique linéaire et une architecture hybride dynamique avec état continu, routage, experts sélectionnés, agrégation et boucle de retour.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #fbfcff; }
      .panel-static { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .panel-dyn { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.7; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .node-static { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
      .node-dyn { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.5; }
      .node-route { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #1e293b; }
      .text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .line-loop { stroke: #16a34a; stroke-width: 1.7; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720"/>
  <text class="title" x="42" y="48">Hybride dynamique vs pipeline statique</text>
  <text class="subtitle" x="42" y="72">Un pipeline suit une séquence prévue ; un hybride maintient un état et adapte le routage.</text>

  <rect class="panel-static" x="60" y="130" width="1060" height="190" rx="10"/>
  <text class="label" x="90" y="165">Pipeline statique</text>
  <text class="small" x="90" y="188">Ordre fixe, coût prévisible, debug plus simple.</text>
  <rect class="node-static" x="105" y="225" width="110" height="54" rx="7"/><text class="text" x="142" y="258">Entrée</text>
  <rect class="node" x="290" y="225" width="110" height="54" rx="7"/><text class="text" x="322" y="258">Étape A</text>
  <rect class="node" x="475" y="225" width="110" height="54" rx="7"/><text class="text" x="507" y="258">Étape B</text>
  <rect class="node" x="660" y="225" width="110" height="54" rx="7"/><text class="text" x="692" y="258">Étape C</text>
  <rect class="node-static" x="845" y="225" width="110" height="54" rx="7"/><text class="text" x="882" y="258">Sortie</text>
  <path class="line" d="M 215 252 L 290 252"/>
  <path class="line" d="M 400 252 L 475 252"/>
  <path class="line" d="M 585 252 L 660 252"/>
  <path class="line" d="M 770 252 L 845 252"/>

  <rect class="panel-dyn" x="60" y="390" width="1060" height="240" rx="10"/>
  <text class="label" x="90" y="425">Hybride dynamique</text>
  <text class="small" x="90" y="448">État continu, routage conditionnel, boucle de retour et observabilité.</text>
  <rect class="node-static" x="105" y="500" width="110" height="54" rx="7"/><text class="text" x="126" y="533">Entrée x(t)</text>
  <rect class="node-dyn" x="280" y="500" width="145" height="54" rx="7"/><text class="text" x="313" y="533">État h(t)</text>
  <rect class="node-route" x="500" y="500" width="120" height="54" rx="7"/><text class="text" x="535" y="533">Routeur</text>
  <rect class="node" x="690" y="500" width="155" height="54" rx="7"/><text class="text" x="716" y="533">Experts choisis</text>
  <rect class="node-route" x="905" y="500" width="120" height="54" rx="7"/><text class="text" x="930" y="533">Agrégateur</text>
  <rect class="node-static" x="905" y="585" width="120" height="42" rx="7"/><text class="small" x="948" y="611">Sortie</text>
  <path class="line" d="M 215 527 L 280 527"/>
  <path class="line" d="M 425 527 L 500 527"/>
  <path class="line" d="M 620 527 L 690 527"/>
  <path class="line" d="M 845 527 L 905 527"/>
  <path class="line" d="M 965 554 L 965 585"/>
  <path class="line-loop" d="M 905 520 C 760 440, 430 435, 355 500"/>

  <text class="small" x="304" y="682">FIG-030-002 - L'hybride dynamique ajoute une boucle de contrôle ; il doit donc justifier sa complexité par des mesures.</text>
</svg>
