<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FIG-015-002 - LTC vs CfC : coût</title>
  <desc id="desc">Comparaison pédagogique du coût d'inférence et du compromis qualité entre LTC avec solveur et CfC sans solveur ODE général.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .axis { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
      .grid { stroke: #dbe4f0; stroke-width: 1.2; }
      .ltcLine { fill: none; stroke: #ea580c; stroke-width: 4; }
      .cfcLine { fill: none; stroke: #047857; stroke-width: 4; }
      .ltcDot { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; }
      .cfcDot { fill: #ecfdf5; stroke: #047857; stroke-width: 3; }
      .legendLtc { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .legendCfc { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .math { font: 600 14px "Consolas", "Cascadia Mono", monospace; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="54">LTC vs CfC : coût d'inférence et compromis pratique</text>
  <text class="subtitle" x="48" y="82">Illustration pédagogique : CfC évite le solveur ODE général, mais doit toujours être évalué sur la tâche réelle.</text>

  <rect class="panel" x="70" y="125" width="1060" height="500" rx="14"/>

  <line class="grid" x1="165" y1="500" x2="790" y2="500"/>
  <line class="grid" x1="165" y1="420" x2="790" y2="420"/>
  <line class="grid" x1="165" y1="340" x2="790" y2="340"/>
  <line class="grid" x1="165" y1="260" x2="790" y2="260"/>
  <line class="axis" x1="165" y1="535" x2="810" y2="535"/>
  <line class="axis" x1="165" y1="535" x2="165" y2="190"/>

  <text class="small" x="650" y="580">taille / complexité de séquence</text>
  <text class="small" x="86" y="195">latence</text>

  <path class="ltcLine" d="M205 490 C300 470 405 425 500 350 C605 265 685 220 770 205"/>
  <path class="cfcLine" d="M205 505 C310 498 420 485 530 470 C640 452 710 438 770 425"/>

  <circle class="ltcDot" cx="205" cy="490" r="7"/>
  <circle class="ltcDot" cx="500" cy="350" r="7"/>
  <circle class="ltcDot" cx="770" cy="205" r="7"/>

  <circle class="cfcDot" cx="205" cy="505" r="7"/>
  <circle class="cfcDot" cx="530" cy="470" r="7"/>
  <circle class="cfcDot" cx="770" cy="425" r="7"/>

  <rect class="legendLtc" x="860" y="225" width="34" height="24" rx="4"/>
  <text class="small" x="905" y="243">LTC avec solveur</text>
  <rect class="legendCfc" x="860" y="270" width="34" height="24" rx="4"/>
  <text class="small" x="905" y="288">CfC sans solveur ODE général</text>

  <rect class="note" x="845" y="360" width="255" height="94" rx="8"/>
  <text class="small" x="868" y="386">Figure pédagogique :</text>
  <text class="small" x="868" y="408">elle illustre un compromis,</text>
  <text class="small" x="868" y="430">pas un benchmark du dépôt.</text>

  <rect class="panel" x="845" y="475" width="255" height="82" rx="8"/>
  <text class="small" x="868" y="512">À mesurer réellement :</text>
  <text class="small" x="868" y="534">latence, mémoire, précision,</text>
  <text class="small" x="868" y="556">robustesse hors distribution.</text>

  <text class="math" x="200" y="562">court</text>
  <text class="math" x="485" y="562">moyen</text>
  <text class="math" x="745" y="555">long</text>

  <text class="small" x="420" y="665">FIG-015-002 - LTC vs CfC : coût</text>
</svg>
